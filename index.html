<body>

</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const playBtn = document.getElementById('play-btn');
const calmBtn = document.getElementById('calm-btn');
const timerEl = document.getElementById('timer');
const affirmationEl = document.getElementById('affirmation');
const completeEl = document.getElementById('complete');
const hintEl = document.getElementById('hint');

let dpr, maskData = [], holeData = [];
let particles = [];
const N = 2000;

let analyser, dataArray, audioCtx;
let audioIntensity = 0, idleTime = 0;
let audioMode = 'idle';
let currentAudio = null;
let sessionStartTime = null;
let sessionComplete = false;
const SESSION_DURATION = 255;

let exploding = false;
let explosionTime = 0;
const EXPLOSION_DURATION = 3000;
let idleGlowTime = 0;
let calmMode = false;
let pointer = { x: -9999, y: -9999, active: false };

// Two separate off-screen canvases
// maskCanvas = filled solid 8 (for particle collision)
// holeCanvas = just the two inner loops filled black (for punching holes)
let holeCanvas, holeCtx;

const AFFIRMATIONS = [
    "you are exactly where you need to be",
    "this moment belongs to you",
    "let it pass · it always does",
    "you are stronger than you know",
    "breathe · release · return",
    "peace is already within you",
    "you are not your thoughts",
    "this too shall pass",
    "you are safe right now",
    "your mind is clearing",
    "you are more than enough",
    "one breath at a time",
    "you deserve this moment",
];
let affirmIndex = 0, affirmTimer = 0;
const AFFIRM_INTERVAL = 30;

const COLORS_NORMAL = [
    [0,   200, 255],
    [0,   150, 255],
    [80,  220, 255],
    [0,   255, 180],
    [0,   255, 80],
    [0,   255, 80],
    [100, 255, 100],
    [0,   200, 255],
];
const COLORS_CALM = [
    [0,   120, 200],
    [0,   100, 180],
    [60,  160, 220],
    [0,   180, 160],
    [80,  200, 120],
];
const GREEN = [0, 255, 60];
const rc = () => {
    const p = calmMode ? COLORS_CALM : COLORS_NORMAL;
    return p[Math.floor(Math.random() * p.length)];
};

window.addEventListener('mousemove', e => {
    pointer.x = e.clientX * dpr; pointer.y = e.clientY * dpr; pointer.active = true;
});
window.addEventListener('mouseout', () => pointer.active = false);
window.addEventListener('touchmove', e => {
    e.preventDefault();
    pointer.x = e.touches[0].clientX * dpr;
    pointer.y = e.touches[0].clientY * dpr;
    pointer.active = true;
}, { passive: false });
window.addEventListener('touchend', () => pointer.active = false);

function enableCalmMode() {
    calmMode = true; calmBtn.textContent = '☀️ Normal Mode';
    calmBtn.classList.add('active'); particles.forEach(p => p.color = rc());
}
function disableCalmMode() {
    calmMode = false; calmBtn.textContent = '🌙 Calm Mode';
    calmBtn.classList.remove('active'); particles.forEach(p => p.color = rc());
}
calmBtn.addEventListener('click', () => calmMode ? disableCalmMode() : enableCalmMode());

function triggerExplosion() {
    exploding = true;
    explosionTime = performance.now();
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const W = canvas.width;
    const H = canvas.height;

    particles.forEach((p, i) => {
        // Spawn from within the 8 shape — find a valid mask pixel
        let sx, sy, attempts = 0;
        do {
            sx = Math.floor(Math.random() * W);
            sy = Math.floor(Math.random() * H);
            attempts++;
        } while (maskData[sy * W + sx] !== 1 && attempts < 30);

        // If no mask pixel found just use center
        if (attempts >= 30) { sx = cx; sy = cy; }

        p.x = sx;
        p.y = sy;

        // Explode outward from center
        const dx = sx - cx;
        const dy = sy - cy;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const speed = Math.random() * 28 + 10;

        p.vx = (dx / dist) * speed + (Math.random() - 0.5) * 6;
        p.vy = (dy / dist) * speed + (Math.random() - 0.5) * 6;

        // Alternate green shades for vibrancy
        const greens = [
            [0, 255, 60],
            [0, 255, 120],
            [80, 255, 80],
            [0, 200, 80],
            [120, 255, 0],
        ];
        p.color = [...greens[Math.floor(Math.random() * greens.length)]];
        p.life = 0.8 + Math.random() * 0.2;
    });
}

playBtn.addEventListener('click', async () => {
    if (audioMode === 'track') {
        if (currentAudio) currentAudio.pause();
        audioMode = 'idle';
        playBtn.textContent = '▶ Begin Quest';
        playBtn.classList.remove('active');
        sessionStartTime = null;
        timerEl.textContent = '04:15';
        hintEl.style.opacity = '1';
        return;
    }
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        currentAudio = new Audio('808beat-4GSynth.mp3');
        currentAudio.crossOrigin = 'anonymous';
        currentAudio.loop = false;
        const source = audioCtx.createMediaElementSource(currentAudio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        await currentAudio.play();
        audioMode = 'track';
        sessionStartTime = performance.now();
        sessionComplete = false;
        affirmIndex = 0; affirmTimer = 0;
        playBtn.textContent = '■ End Quest';
        playBtn.classList.add('active');
        hintEl.style.opacity = '0';
        triggerExplosion();
        setTimeout(() => showAffirmation(), 3500);
    } catch(e) {
        playBtn.textContent = 'Audio Error';
        console.error(e);
    }
});

function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    const W = canvas.width;
    const H = canvas.height;
    const sz = Math.min(W, H) * 0.72;
    const cx = W / 2;
    const cy = H / 2;

    // --- MASK CANVAS: solid filled 8 for particle collision ---
    const mc = document.createElement('canvas');
    mc.width = W; mc.height = H;
    const mctx = mc.getContext('2d');
    mctx.fillStyle = '#fff';
    mctx.font = `900 ${sz}px sans-serif`;
    mctx.textAlign = 'center'; mctx.textBaseline = 'middle';
    mctx.fillText('8', cx, cy);
    const d = mctx.getImageData(0, 0, W, H).data;
    maskData = new Uint8Array(W * H);
    for (let i = 0; i < d.length; i += 4) maskData[i/4] = d[i] > 128 ? 1 : 0;

    // --- HOLE CANVAS: use actual pixel data to find the true inner holes ---
    // Render the 8 with even-odd fill rule to get only the hollow interior
    // We detect pixels that are BLACK inside the bounding box of the 8
    // (i.e. surrounded by white on all sides = inside a loop)
    holeCanvas = document.createElement('canvas');
    holeCanvas.width = W; holeCanvas.height = H;
    holeCtx = holeCanvas.getContext('2d');

    // Draw the 8 outline using even-odd so inner areas are transparent
    // Then flood-fill the interior pixels black
    // Simpler: draw solid white 8, then draw it again with destination-out
    // to punch holes using the font's own shape

    // Step 1: draw solid 8 in white
    const mc2 = document.createElement('canvas');
    mc2.width = W; mc2.height = H;
    const mc2ctx = mc2.getContext('2d');
    mc2ctx.fillStyle = '#fff';
    mc2ctx.font = `900 ${sz}px sans-serif`;
    mc2ctx.textAlign = 'center'; mc2ctx.textBaseline = 'middle';
    mc2ctx.fillText('8', cx, cy);

    // Step 2: scan pixels — find interior holes (black pixels surrounded by the 8)
    // A pixel is a "hole" if: it is black AND the 8 is solid (maskData=1) within ~stroke width
    // Easier: render with strokeText only and detect interior via flood fill approach
    // Most reliable: render 8 with white, shrink inward, XOR to get only the inner area

    // Approach: draw solid 8, then draw it again smaller (eroded) in black
    // This leaves just the stroke ring, making holes pure black
    const erosion = sz * 0.04; // how thick the stroke appears
    mc2ctx.globalCompositeOperation = 'destination-out';
    mc2ctx.fillStyle = 'rgba(0,0,0,1)';
    mc2ctx.font = `900 ${sz * 0.88}px sans-serif`; // slightly smaller = erodes inward
    mc2ctx.textAlign = 'center'; mc2ctx.textBaseline = 'middle';
    mc2ctx.fillText('8', cx, cy + sz * 0.004); // tiny offset keeps it centered
    mc2ctx.globalCompositeOperation = 'source-over';

    // Step 3: invert — the eroded interior + outside = black holes on holeCanvas
    // We only want interior holes, not the outside
    // Draw the eroded mask as black on holeCanvas only where maskData = 0 (outside 8)
    // Simplest: just draw the mc2 result (which shows only the ring) — 
    // then fill INSIDE the eroded area black

    // Final clean approach: holeCanvas gets black pixels where mc2 is transparent (holes)
    // but only inside the 8 bounding area
    holeCtx.fillStyle = '#000';
    holeCtx.fillRect(0, 0, W, H); // start all black
    holeCtx.globalCompositeOperation = 'destination-out';
    holeCtx.drawImage(mc2, 0, 0); // punch out the ring (white areas of mc2)
    holeCtx.globalCompositeOperation = 'source-over';
    // Now holeCanvas = black everywhere EXCEPT where the ring stroke is
    // But we only want to stamp holes INSIDE the 8 bounds
    // Mask out the outside by drawing the solid 8 outline as destination-in
    const mc3 = document.createElement('canvas');
    mc3.width = W; mc3.height = H;
    const mc3ctx = mc3.getContext('2d');
    mc3ctx.fillStyle = '#fff';
    mc3ctx.font = `900 ${sz}px sans-serif`;
    mc3ctx.textAlign = 'center'; mc3ctx.textBaseline = 'middle';
    mc3ctx.fillText('8', cx, cy);
    holeCtx.globalCompositeOperation = 'destination-in';
    holeCtx.drawImage(mc3, 0, 0);
    holeCtx.globalCompositeOperation = 'source-over';

    particles = [];
    for (let i = 0; i < N; i++) particles.push(new P(true));
}

class P {
    constructor(scattered) {
        this.color = rc(); this.reset();
        if (scattered) this.y = Math.random() * canvas.height;
    }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = -Math.random() * canvas.height * 0.5;
        this.vx = (Math.random() - 0.5) * (calmMode ? 0.4 : 0.8);
        this.vy = Math.random() * (calmMode ? 0.8 : 1.6) + (calmMode ? 0.5 : 1.0);
        this.life = Math.random();
        this.color = rc();
    }
    update(boost) {
        if (exploding) {
            const elapsed = performance.now() - explosionTime;
            const progress = Math.min(1, elapsed / EXPLOSION_DURATION);

            // Add gravity during explosion so particles arc downward naturally
            this.vy += 0.3;
            // Slow down over time
            this.vx *= 0.97;
            this.vy *= 0.97;

            this.x += this.vx;
            this.y += this.vy;

            // Wrap sides
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;

            // Near end of explosion — smoothly transition velocity toward rain fall
            if (progress > 0.7) {
                const t = (progress - 0.7) / 0.3;
                this.vx += (0 - this.vx) * t * 0.05;
                this.vy += (1.2 - this.vy) * t * 0.03;
            }

            // Recycle particles that fall off bottom during explosion
            if (this.y > canvas.height + 20) {
                this.x = Math.random() * canvas.width;
                this.y = -Math.random() * 20;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = Math.random() * 1.6 + 1.0;
                this.color = rc();
            }
            return;
        }
        let nx = this.x + this.vx;
        let ny = this.y + this.vy + boost;
        if (ny > canvas.height) {
            this.x = Math.random() * canvas.width;
            this.y = -Math.random() * 20;
            this.vx = (Math.random() - 0.5) * (calmMode ? 0.4 : 0.8);
            this.vy = Math.random() * (calmMode ? 0.8 : 1.6) + (calmMode ? 0.5 : 1.0);
            this.color = rc();
            return;
        }

        // Always maintain a minimum fall speed so rain never dies out
        const minFall = calmMode ? 0.5 : 1.0;
        if (this.vy < minFall) this.vy = minFall;
        if (nx < 0 || nx > canvas.width) this.vx *= -0.5;
        const idx = Math.floor(ny) * canvas.width + Math.floor(nx);
        if (maskData[idx] === 1) {
            this.vx += this.x < canvas.width / 2 ? -0.5 : 0.5;
            this.vy *= 0.97; // was 0.9 — much less slowdown on the 8
        } else {
            this.vx *= 0.98;
        }
        if (pointer.active) {
            const dx = this.x - pointer.x, dy = this.y - pointer.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const r = 160 * dpr;
            if (dist < r && dist > 0) {
                const f = (r - dist) / r;
                this.vx += (dx/dist) * f * (calmMode ? 1.2 : 2.5);
                this.vy += (dy/dist) * f * (calmMode ? 1.2 : 2.5);
            }
        }
        this.x += this.vx;
        this.y += this.vy + boost;
    }
    draw(intensity, pulse) {
        const [r, g, b] = this.color;
        const a = Math.min(1, 0.4 + this.life * 0.45 + intensity * 0.005 + pulse * 0.3);
        const sz = (1.0 + intensity * 0.008 + pulse * 0.8) * dpr;
        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, sz, 0, Math.PI * 2);
        ctx.fill();
    }
}

function showAffirmation() {
    if (sessionComplete) return;
    const text = AFFIRMATIONS[affirmIndex % AFFIRMATIONS.length];

    // Wait for a beat peak to appear — check audioIntensity
    const waitForBeat = () => {
        if (audioIntensity > 40 || audioMode === 'idle') {
            // Fade in
            affirmationEl.style.transition = 'color 1.5s, opacity 1.5s';
            affirmationEl.style.opacity = '1';
            affirmationEl.style.color = calmMode
                ? 'rgba(150,180,255,0.55)'
                : 'rgba(0,220,255,0.65)';
            affirmationEl.textContent = text;

            // Hold then fade out
            setTimeout(() => {
                affirmationEl.style.transition = 'color 2.5s, opacity 2.5s';
                affirmationEl.style.color = 'rgba(0,200,255,0)';
                affirmationEl.style.opacity = '0';
            }, 6000);
        } else {
            // Not on beat yet — wait a tick
            setTimeout(waitForBeat, 100);
        }
    };
    waitForBeat();
    affirmIndex++;
}

function replayQuest() {
    completeEl.classList.remove('show');
    sessionStartTime = null; sessionComplete = false;
    timerEl.textContent = '04:15';
    playBtn.textContent = '▶ Begin Quest';
    playBtn.classList.remove('active');
    audioMode = 'idle';
    hintEl.style.opacity = '1';
    affirmationEl.style.color = 'rgba(0,200,255,0)';
    exploding = false;
    particles.forEach(p => p.reset());
}

function triggerSessionComplete() {
    sessionComplete = true;
    completeEl.classList.add('show');
    particles.forEach(p => {
        p.vx = (Math.random() - 0.5) * (calmMode ? 6 : 14);
        p.vy = (Math.random() - 0.5) * (calmMode ? 6 : 14);
        p.color = calmMode ? [80, 150, 220] : [0, 220, 255];
    });
    if (currentAudio) {
        setTimeout(() => {
            let vol = 1;
            const fade = setInterval(() => {
                vol -= 0.05;
                if (currentAudio) currentAudio.volume = Math.max(0, vol);
                if (vol <= 0) clearInterval(fade);
            }, 200);
        }, 2000);
    }
}

function drawIdleEight() {
    idleGlowTime += 0.02;
    const pulse = Math.sin(idleGlowTime) * 0.5 + 0.5;
    const sz = Math.min(canvas.width, canvas.height) * 0.72;
    ctx.save();
    // Crisp outline only — no glow, no shadow
    ctx.globalAlpha = 0.25 + pulse * 0.35;
    ctx.strokeStyle = 'rgba(0,200,255,1)';
    ctx.lineWidth = 2.5 * dpr;
    ctx.shadowBlur = 0;
    ctx.font = `900 ${sz}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeText('8', canvas.width / 2, canvas.height / 2);
    ctx.restore();
}

function drawExplosionGlow() {
    const elapsed = performance.now() - explosionTime;
    const progress = elapsed / EXPLOSION_DURATION;
    if (progress < 1) {
        const sz = Math.min(canvas.width, canvas.height) * 0.72;
        ctx.save();

        // First 0.2s — bright white/green flash like a shatter
        if (progress < 0.15) {
            const flashAlpha = (0.15 - progress) / 0.15;
            ctx.globalAlpha = flashAlpha * 0.9;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6 * dpr;
            ctx.shadowColor = '#00ff44';
            ctx.shadowBlur = 40 * dpr;
            ctx.font = `900 ${sz}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.strokeText('8', canvas.width / 2, canvas.height / 2);
        }

        // Rest of explosion — green fading outline
        const alpha = Math.max(0, (1 - progress) * 0.4);
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = 'rgba(0,255,80,1)';
        ctx.lineWidth = 2.5 * dpr;
        ctx.shadowColor = 'rgba(0,255,80,1)';
        ctx.shadowBlur = 12 * dpr * (1 - progress);
        ctx.font = `900 ${sz}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.strokeText('8', canvas.width / 2, canvas.height / 2);
        ctx.restore();
    } else {
        exploding = false;
        // Smoothly recolor all particles to normal mix
        particles.forEach(p => { p.color = rc(); });
    }
}

function punchHoles() {
    // Stamp the pre-rendered black hole ellipses over the particle layer
    // This cuts the inner loops of the 8 back to pure black every frame
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(holeCanvas, 0, 0);
}

function animate() {
    requestAnimationFrame(animate);

    if (audioMode !== 'idle' && analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < 12; i++) sum += dataArray[i];
        audioIntensity = sum / 12;
    } else {
        audioIntensity *= 0.92;
    }

    if (sessionStartTime && !sessionComplete) {
        const elapsed = (performance.now() - sessionStartTime) / 1000;
        const remaining = Math.max(0, SESSION_DURATION - elapsed);
        const m = Math.floor(remaining / 60);
        const s = Math.floor(remaining % 60);
        timerEl.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        affirmTimer += 1/60;
        if (affirmTimer >= AFFIRM_INTERVAL) { affirmTimer = 0; showAffirmation(); }
        if (elapsed >= SESSION_DURATION) triggerSessionComplete();
    }

    idleTime += calmMode ? 0.008 : 0.018;
    const pulse = audioMode === 'idle' ? (Math.sin(idleTime) * 0.5 + 0.5) : 0;
    const boost = audioIntensity * (calmMode ? 0.02 : 0.04) + pulse * (calmMode ? 0.15 : 0.3);

    // Trail fade
    ctx.fillStyle = calmMode ? 'rgba(0,0,0,0.14)' : 'rgba(0,0,0,0.16)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Idle 8 glow — only before quest, disappears the moment Begin Quest is tapped
    if (audioMode === 'idle' && !exploding && !sessionComplete) {
        drawIdleEight();
    }

    // Particles
    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => { p.update(boost); p.draw(audioIntensity, pulse); });
    ctx.globalCompositeOperation = 'source-over';

    // PUNCH BLACK HOLES — only in idle mode, 8 fully disappears once quest begins
    if (audioMode === 'idle' && !exploding && holeCanvas) {
        punchHoles();
    }

    // Explosion glow
    if (exploding) {
        drawExplosionGlow();
    }
}

window.addEventListener('resize', resize);
resize();
animate();
</script>

</body>
