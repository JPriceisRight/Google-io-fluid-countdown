<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Quest — Save Icon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 24px;
            font-family: 'Courier New', monospace;
        }
        canvas { border-radius: 40px; display: block; width: 280px; height: 280px; }
        .label { color: rgba(0,200,255,0.6); font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }
        #save-btn {
            background: transparent;
            border: 1px solid rgba(0,200,255,0.6);
            color: rgba(0,200,255,0.9);
            font-family: 'Courier New', monospace;
            font-size: 11px; letter-spacing: 4px;
            padding: 14px 32px; cursor: pointer;
            text-transform: uppercase;
        }
        #instructions {
            color: rgba(255,255,255,0.35);
            font-size: 10px; letter-spacing: 2px;
            text-align: center; line-height: 2;
            max-width: 280px;
        }
    </style>
</head>
<body>

<div class="label">Self Quest · Icon</div>
<canvas id="icon" width="1024" height="1024"></canvas>
<button id="save-btn">⬇ Download icon.png</button>
<div id="instructions">
    ON iPHONE: press & hold the icon above<br>
    then tap "Save to Photos"<br><br>
    ON DESKTOP: click Download button
</div>

<script>
const canvas = document.getElementById('icon');
const ctx = canvas.getContext('2d');
const W = 1024, H = 1024;

// Background
const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
bg.addColorStop(0, '#060d1f');
bg.addColorStop(1, '#000204');
ctx.fillStyle = bg;
ctx.roundRect(0, 0, W, H, 120);
ctx.fill();

// Subtle grid
ctx.strokeStyle = 'rgba(0,80,200,0.06)';
ctx.lineWidth = 1;
[128,256,384,512,640,768,896].forEach(x => {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,x); ctx.lineTo(W,x); ctx.stroke();
});

// Outer ring glow
ctx.save();
ctx.shadowColor = 'rgba(0,200,255,0.6)';
ctx.shadowBlur = 20;
ctx.strokeStyle = 'rgba(0,200,255,0.5)';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.arc(W/2, H/2, 440, 0, Math.PI*2);
ctx.stroke();
ctx.restore();

// Inner ring
ctx.strokeStyle = 'rgba(0,150,255,0.15)';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.arc(W/2, H/2, 400, 0, Math.PI*2);
ctx.stroke();

// Cardinal dots
ctx.save();
ctx.shadowColor = 'rgba(0,255,255,1)';
ctx.shadowBlur = 16;
ctx.fillStyle = '#00ffff';
[[512,72],[952,512],[512,952],[72,512]].forEach(([x,y]) => {
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI*2); ctx.fill();
});
ctx.fillStyle = '#00ddff';
[[820,188],[820,836],[204,836],[204,188]].forEach(([x,y]) => {
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
});
// Extra sparkle dots
ctx.fillStyle = 'rgba(255,255,255,0.5)';
[[620,136],[400,130],[900,360],[900,650],[620,890],[400,885],[124,360],[120,650]].forEach(([x,y]) => {
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
});
ctx.restore();

// Soft glow behind 8
const glowBg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 320);
glowBg.addColorStop(0, 'rgba(0,120,255,0.18)');
glowBg.addColorStop(1, 'rgba(0,0,0,0)');
ctx.fillStyle = glowBg;
ctx.beginPath();
ctx.ellipse(W/2, H/2, 300, 340, 0, 0, Math.PI*2);
ctx.fill();

// Draw the 8 — outer wide glow
ctx.save();
ctx.shadowColor = 'rgba(0,180,255,0.5)';
ctx.shadowBlur = 60;
ctx.strokeStyle = 'rgba(0,180,255,0.2)';
ctx.lineWidth = 40;
ctx.font = '900 680px Arial Black, sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.strokeText('8', W/2, H/2 + 20);
ctx.restore();

// Draw the 8 — medium glow
ctx.save();
ctx.shadowColor = 'rgba(0,220,255,0.8)';
ctx.shadowBlur = 30;
ctx.strokeStyle = 'rgba(0,200,255,0.35)';
ctx.lineWidth = 16;
ctx.font = '900 680px Arial Black, sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.strokeText('8', W/2, H/2 + 20);
ctx.restore();

// Draw the 8 — crisp cyan stroke
const strokeGrad = ctx.createLinearGradient(0, 200, 0, 820);
strokeGrad.addColorStop(0, '#00ffff');
strokeGrad.addColorStop(0.5, '#0099ff');
strokeGrad.addColorStop(1, '#00eeff');
ctx.save();
ctx.shadowColor = 'rgba(0,210,255,1)';
ctx.shadowBlur = 12;
ctx.strokeStyle = strokeGrad;
ctx.lineWidth = 7;
ctx.font = '900 680px Arial Black, sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.strokeText('8', W/2, H/2 + 20);
ctx.restore();

// Neon green center dot
ctx.save();
ctx.shadowColor = '#00ff44';
ctx.shadowBlur = 30;
ctx.fillStyle = '#00ff44';
ctx.beginPath();
ctx.arc(W/2, H/2, 14, 0, Math.PI*2);
ctx.fill();
ctx.shadowBlur = 0;
ctx.fillStyle = '#ffffff';
ctx.beginPath();
ctx.arc(W/2, H/2, 6, 0, Math.PI*2);
ctx.fill();
ctx.restore();

// Download button
document.getElementById('save-btn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'icon.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
});
</script>

</body>
</html>
