<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Quest - Safety Optimized</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; }

        #ui-layer {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            pointer-events: none;
            z-index: 10;
        }

        #affirmation {
            color: #39FF14;
            font-size: clamp(1.5rem, 8vw, 3rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
            opacity: 0;
            /* Smooth transitions for medical safety */
            transition: opacity 2s ease-in-out, transform 0.3s ease-out;
        }

        .controls {
            position: absolute;
            bottom: 15%;
            width: 100%;
            text-align: center;
            z-index: 20;
        }

        button {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #39FF14;
            color: #39FF14;
            padding: 18px 40px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="affirmation">YOU ARE MORE THAN ENOUGH</div>
</div>

<div class="controls" id="menu">
    <button id="startBtn">▶ BEGIN QUEST</button>
</div>

<canvas id="fluidCanvas"></canvas>

<script>
    const canvas = document.getElementById('fluidCanvas');
    const ctx = canvas.getContext('2d');
    const affText = document.getElementById('affirmation');
    const startBtn = document.getElementById('startBtn');

    let width, height, maskData;
    let particles = [];
    const PARTICLE_COUNT = 1000;
    
    // 128 BPM = ~468.75ms per beat
    const beatDuration = (60 / 128) * 1000;
    let beatCounter = 0;
    let isExplosionPhase = false;
    let globalPulse = 0;

    const affirmations = [
        "YOU ARE MORE THAN ENOUGH",
        "BREATHE INTO THE STILLNESS",
        "YOU ARE RADIANT AND WHOLE",
        "CARRY THIS PEACE WITH YOU"
    ];
    let affIndex = 0;

    // --- AUDIO CONTEXT (Keeping your music logic) ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Your synthesizer/music code continues here...
        }
    }

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        createMask();
    }

    function createMask() {
        const mCanvas = document.createElement('canvas');
        mCanvas.width = width; mCanvas.height = height;
        const mCtx = mCanvas.getContext('2d');
        mCtx.fillStyle = 'white';
        mCtx.font = `900 ${Math.min(width, height) * 0.7}px sans-serif`;
        mCtx.textAlign = 'center'; mCtx.textBaseline = 'middle';
        mCtx.fillText('8', width / 2, height / 2);
        const imgData = mCtx.getImageData(0, 0, width, height).data;
        maskData = new Uint8Array(width * height);
        for (let i = 0; i < imgData.length; i += 4) maskData[i / 4] = imgData[i] > 128 ? 1 : 0;
    }

    class Particle {
        constructor() { this.reset(); this.y = Math.random() * height; }
        reset() {
            this.x = Math.random() * width;
            this.y = height + 10;
            this.vx = (Math.random() - 0.5) * 1.2;
            this.vy = -(Math.random() * 1.5 + 1);
            this.size = Math.random() * 2 + 1;
        }
        update() {
            let nextX = this.x + this.vx;
            let nextY = this.y + this.vy;
            let idx = Math.floor(nextY) * width + Math.floor(nextX);

            // Flowing around the "8"
            if (maskData[idx] === 1) {
                this.vx += (this.x < width / 2 ? -0.3 : 0.3);
                this.vy *= 0.94; 
            } else {
                this.vx *= 0.97; // Underwater drag
            }
            this.x += this.vx; this.y += this.vy;
            if (this.y < 0) this.reset();
        }
        draw() {
            // Brightness syncs with pulse but stays medically safe (subtle opacity)
            ctx.fillStyle = `rgba(57, 255, 20, ${0.4 + globalPulse * 0.3})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size + (globalPulse * 2), 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function triggerUnderwaterExplosion() {
        particles.forEach(p => {
            let dx = p.x - width / 2;
            let dy = p.y - height / 2;
            let dist = Math.sqrt(dx*dx + dy*dy) || 1;
            p.vx += (dx / dist) * 12;
            p.vy += (dy / dist) * 12;
        });
    }

    startBtn.addEventListener('click', () => {
        initAudio(); // Starts your music logic
        document.getElementById('menu').classList.add('hidden');
        
        // PHASE 1: 3-Second Pulsate (Medical Safety Rule)
        affText.style.opacity = 1;
        let startPulse = setInterval(() => {
            globalPulse = 0.3; // Gentle pulse
            setTimeout(() => globalPulse = 0, 200);
        }, 1000);

        // PHASE 2: After 3 seconds, stop pulse and hold for 8 seconds (11s total)
        setTimeout(() => {
            clearInterval(startPulse);
            globalPulse = 0; // Steady light
            
            // PHASE 3: Begin 128 BPM Sync and Affirmation Cycle
            setTimeout(() => {
                isExplosionPhase = true;
                triggerUnderwaterExplosion();
                setInterval(heartbeat, beatDuration);
            }, 8000); 
        }, 3000);
    });

    function heartbeat() {
        beatCounter++;
        globalPulse = 0.5; // Visual kick drum pulse
        
        // Subtle text scale on beat
        affText.style.transform = "translate(-50%, -50%) scale(1.05)";
        setTimeout(() => {
            affText.style.transform = "translate(-50%, -50%) scale(1)";
            globalPulse *= 0.5;
        }, 150);

        // Change affirmation every 64 beats (exactly 30 seconds)
        if (beatCounter % 64 === 0) {
            affIndex = (affIndex + 1) % affirmations.length;
            affText.style.opacity = 0;
            setTimeout(() => {
                affText.innerText = affirmations[affIndex];
                affText.style.opacity = 1;
                triggerUnderwaterExplosion(); // Explosion on new phrase
            }, 1000);
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.12)'; // Slow trail for "water" feel
        ctx.fillRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'lighter';
        
        particles.forEach(p => {
            p.update();
            p.draw();
        });

        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
    animate();
</script>
</body>
</html>
