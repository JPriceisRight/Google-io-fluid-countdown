<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google I/O Countdown - Audio Reactive 8</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000000;
            overflow: hidden; font-family: sans-serif;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #ui-text {
            position: absolute; bottom: 30px; width: 100%;
            text-align: center; color: rgba(0, 255, 255, 0.7);
            font-size: 14px; letter-spacing: 4px;
            pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>

<div id="ui-text">TAP ANYWHERE TO INITIALIZE AUDIO</div>
<canvas id="fluidCanvas"></canvas>

<script>
    const canvas = document.getElementById('fluidCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, dpr;
    let maskData = [];
    let particles = [];
    const PARTICLE_COUNT = 1500; 

    // --- AUDIO API VARIABLES ---
    let audioContext, analyser, dataArray;
    let isAudioPlaying = false;
    let audioIntensity = 0;

    let pointer = { x: -1000, y: -1000, active: false };

    // Handle touch/mouse for interaction and starting audio
    function handleInteraction(x, y) {
        pointer.x = x * dpr; // Scale touch to retina pixels
        pointer.y = y * dpr;
        pointer.active = true;

        if (!isAudioPlaying) {
            initAudio();
        }
    }

    window.addEventListener('mousemove', (e) => handleInteraction(e.clientX, e.clientY));
    window.addEventListener('mouseout', () => pointer.active = false);
    window.addEventListener('touchstart', (e) => handleInteraction(e.touches[0].clientX, e.touches[0].clientY));
    window.addEventListener('touchmove', (e) => handleInteraction(e.touches[0].clientX, e.touches[0].clientY));
    window.addEventListener('touchend', () => pointer.active = false);

    // --- THE RETINA FIX ---
    function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Scale canvas internal resolution up, keep CSS size the same
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        
        createMask();
    }

    function createMask() {
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = canvas.width;
        maskCanvas.height = canvas.height;
        const maskCtx = maskCanvas.getContext('2d');

        maskCtx.fillStyle = '#FFFFFF';
        maskCtx.font = `900 ${Math.min(canvas.width, canvas.height) * 0.8}px sans-serif`;
        maskCtx.textAlign = 'center';
        maskCtx.textBaseline = 'middle';
        maskCtx.fillText('8', canvas.width / 2, canvas.height / 2);

        const imageData = maskCtx.getImageData(0, 0, canvas.width, canvas.height).data;
        maskData = new Uint8Array(canvas.width * canvas.height);
        
        for (let i = 0; i < imageData.length; i += 4) {
            maskData[i / 4] = imageData[i] > 128 ? 1 : 0;
        }
    }

    // --- THE AUDIO SETUP ---
    function initAudio() {
        isAudioPlaying = true;
        document.getElementById('ui-text').style.display = 'none'; // Hide text

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        const audio = new Audio();
        audio.src = '808beat-4GSynth.mp3'; // <-- PUT YOUR MP3 NAME HERE
        audio.crossOrigin = "anonymous";
        audio.play();

        const source = audioContext.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
    }

    class Particle {
        constructor() {
            this.reset();
            this.y = Math.random() * canvas.height; 
        }

        reset() {
            this.x = Math.random() * canvas.width;
            this.y = -Math.random() * 50; 
            this.vx = (Math.random() - 0.5) * 1.5; 
            this.vy = (Math.random() * 3 + 2); 
            this.life = Math.random(); 
        }

        update() {
            // Add audio intensity to velocity so they fall faster on the beat
            let speedBoost = audioIntensity * 0.05;
            
            let nextX = this.x + this.vx;
            let nextY = this.y + this.vy + speedBoost;

            if (nextY > canvas.height || nextX < 0 || nextX > canvas.width) {
                this.reset();
                this.y = -10; 
                return;
            }

            let maskIndex = Math.floor(nextY) * canvas.width + Math.floor(nextX);

            if (maskData[maskIndex] === 1) {
                if (this.x < canvas.width / 2) {
                    this.vx -= 0.5; 
                } else {
                    this.vx += 0.5; 
                }
                this.vy *= 0.95; 
            } else {
                this.vx *= 0.98;
            }

            if (pointer.active) {
                let dx = this.x - pointer.x;
                let dy = this.y - pointer.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let radius = 150 * dpr; // Scale touch radius for iPad

                if (distance < radius) {
                    let forceX = dx / distance;
                    let forceY = dy / distance;
                    let pushPower = (radius - distance) / radius;
                    
                    this.vx += forceX * pushPower * 2;
                    this.vy += forceY * pushPower * 2;
                }
            }

            this.x += this.vx;
            this.y += this.vy + speedBoost;
        }

        draw() {
            // Audio makes the neon green brighter and particles slightly larger
            let brightness = 0.4 + (audioIntensity * 0.005);
            let size = 2 * dpr + (audioIntensity * 0.01);

            ctx.fillStyle = `rgba(0, 255, 0, ${brightness + this.life * 0.4})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        // Analyze audio if playing
        if (isAudioPlaying && analyser) {
            analyser.getByteFrequencyData(dataArray);
            // Get average of lower frequencies (bass)
            let sum = 0;
            for(let i = 0; i < 10; i++) {
                sum += dataArray[i];
            }
            audioIntensity = sum / 10; // 0 to 255
        }

        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; // Darker fade for sharper trails
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.globalCompositeOperation = 'lighter';

        particles.forEach(p => {
            p.update();
            p.draw();
        });

        ctx.globalCompositeOperation = 'source-over';

        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
