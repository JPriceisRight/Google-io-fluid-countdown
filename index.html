<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SELF QUEST</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none;
        }
        canvas { display: block; width: 100%; height: 100%; }

        #brand {
            position: absolute; top: 24px; width: 100%;
            text-align: center;
            color: rgba(0,180,255,0.4);
            font-size: 11px; letter-spacing: 10px;
            pointer-events: none; z-index: 10;
        }
        #timer {
            position: absolute; top: 52px; width: 100%;
            text-align: center;
            color: rgba(0,200,255,0.25);
            font-size: 10px; letter-spacing: 6px;
            pointer-events: none; z-index: 10;
        }
        #affirmation {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(0,200,255,0);
            font-size: 13px; letter-spacing: 3px;
            pointer-events: none; z-index: 10;
            width: 80%; line-height: 2;
            transition: color 3s, opacity 3s;
            text-transform: uppercase;
        }
        #controls {
            position: absolute; bottom: 36px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 12px; z-index: 20;
            align-items: center;
        }
        .btn {
            background: transparent;
            border: 1px solid rgba(0,200,255,0.4);
            color: rgba(0,200,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 10px; letter-spacing: 4px;
            padding: 10px 22px; cursor: pointer;
            transition: all 0.3s; white-space: nowrap;
        }
        .btn:hover { background: rgba(0,200,255,0.08); border-color: rgba(0,200,255,0.8); color: #fff; }
        .btn.active { border-color: rgba(0,255,200,0.8); color: rgba(0,255,200,0.9); box-shadow: 0 0 14px rgba(0,255,200,0.25); }
        .btn.warn { border-color: rgba(255,80,80,0.6); color: rgba(255,80,80,0.7); }
        #hint {
            position: absolute; bottom: 14px; width: 100%;
            text-align: center; color: rgba(0,200,255,0.25);
            font-size: 9px; letter-spacing: 4px;
            pointer-events: none; z-index: 10;
            transition: opacity 2s; text-transform: uppercase;
        }
        #complete {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 30; pointer-events: none;
            opacity: 0; transition: opacity 3s;
        }
        #complete.show { opacity: 1; pointer-events: all; }
        #complete-text {
            color: rgba(0,210,255,0.85);
            font-size: 13px; letter-spacing: 8px;
            text-transform: uppercase;
            text-align: center; line-height: 2.8;
            opacity: 0; transition: opacity 4s;
        }
        #complete.show #complete-text { opacity: 1; }
        #replay-btn {
            margin-top: 40px;
            background: transparent;
            border: 1px solid rgba(0,200,255,0.4);
            color: rgba(0,200,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 10px; letter-spacing: 5px;
            padding: 12px 30px; cursor: pointer;
            opacity: 0; transition: opacity 3s 2s, background 0.3s;
            text-transform: uppercase;
        }
        #complete.show #replay-btn { opacity: 1; }
        #replay-btn:hover { background: rgba(0,200,255,0.1); color: #fff; }
    </style>
</head>
<body>

<div id="brand">S E L F &nbsp; Q U E S T</div>
<div id="timer">— : —</div>
<div id="affirmation"></div>
<canvas id="c"></canvas>

<div id="controls">
    <button class="btn" id="play-btn">▶ Begin Quest</button>
    <button class="btn" id="mic-btn">🎤 Mic</button>
</div>
<div id="hint">touch · move · breathe</div>

<div id="complete">
    <div id="complete-text">
        your quest is complete<br>
        carry this stillness with you<br>
        you are enough
    </div>
    <button id="replay-btn" onclick="replayQuest()">↺ Begin Again</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const playBtn = document.getElementById('play-btn');
const micBtn = document.getElementById('mic-btn');
const hint = document.getElementById('hint');
const timerEl = document.getElementById('timer');
const affirmationEl = document.getElementById('affirmation');
const completeEl = document.getElementById('complete');

let dpr, maskData = [], particles = [];
const N = 1800;
let analyser, dataArray;
let audioIntensity = 0, idleTime = 0;
let audioMode = 'idle';
let currentAudio = null;
let sessionStartTime = null;
let sessionComplete = false;
const SESSION_DURATION = 255; // 4 min 15 sec

const AFFIRMATIONS = [
    "you are exactly where you need to be",
    "this moment belongs to you",
    "let it pass · it always does",
    "you are stronger than you know",
    "breathe · release · return",
    "peace is already within you",
    "you are not your thoughts",
    "this too shall pass",
    "you are safe right now",
    "your mind is clearing",
];

let affirmIndex = 0;
let affirmTimer = 0;
const AFFIRM_INTERVAL = 30; // seconds between affirmations

let pointer = { x: -9999, y: -9999, active: false };

const COLORS = [
    [0,   200, 255],
    [0,   150, 255],
    [80,  220, 255],
    [0,   255, 220],
    [100, 180, 255],
];
const rc = () => COLORS[Math.floor(Math.random() * COLORS.length)];

// Touch / mouse
window.addEventListener('mousemove', e => {
    pointer.x = e.clientX * dpr; pointer.y = e.clientY * dpr; pointer.active = true;
});
window.addEventListener('mouseout', () => pointer.active = false);
window.addEventListener('touchmove', e => {
    e.preventDefault();
    pointer.x = e.touches[0].clientX * dpr;
    pointer.y = e.touches[0].clientY * dpr;
    pointer.active = true;
}, { passive: false });
window.addEventListener('touchend', () => pointer.active = false);

// Play track
playBtn.addEventListener('click', async () => {
    if (audioMode === 'track') {
        currentAudio && currentAudio.pause();
        audioMode = 'idle';
        playBtn.textContent = '▶ Begin Quest';
        playBtn.classList.remove('active');
        sessionStartTime = null;
        timerEl.textContent = '— : —';
        return;
    }
    try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        analyser = ac.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        currentAudio = new Audio('808beat-4GSynth.mp3');
        currentAudio.crossOrigin = 'anonymous';
        const source = ac.createMediaElementSource(currentAudio);
        source.connect(analyser);
        analyser.connect(ac.destination);
        await currentAudio.play();
        audioMode = 'track';
        sessionStartTime = performance.now();
        sessionComplete = false;
        affirmIndex = 0;
        affirmTimer = 0;
        playBtn.textContent = '■ End Quest';
        playBtn.classList.add('active');
        micBtn.classList.remove('active');
        hint.style.opacity = '0';
        showAffirmation();
    } catch(e) {
        playBtn.textContent = 'MP3 Not Found';
        playBtn.classList.add('warn');
        hint.textContent = 'place 808beat-4GSynth.mp3 in same folder';
        hint.style.opacity = '1';
        hint.style.color = 'rgba(255,100,100,0.5)';
    }
});

// Mic
micBtn.addEventListener('click', async () => {
    if (audioMode === 'mic') {
        audioMode = 'idle';
        micBtn.textContent = '🎤 Mic';
        micBtn.classList.remove('active');
        return;
    }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        analyser = ac.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        ac.createMediaStreamSource(stream).connect(analyser);
        audioMode = 'mic';
        micBtn.textContent = '● Live';
        micBtn.classList.add('active');
        playBtn.classList.remove('active');
        if (currentAudio) currentAudio.pause();
        hint.style.opacity = '0';
        if (!sessionStartTime) {
            sessionStartTime = performance.now();
            sessionComplete = false;
        }
    } catch(e) {
        micBtn.textContent = 'Denied';
        micBtn.classList.add('warn');
    }
});

function showAffirmation() {
    const text = AFFIRMATIONS[affirmIndex % AFFIRMATIONS.length];
    affirmationEl.style.color = 'rgba(0,200,255,0.45)';
    affirmationEl.textContent = text;
    setTimeout(() => {
        affirmationEl.style.color = 'rgba(0,200,255,0)';
    }, 6000);
    affirmIndex++;
}

function replayQuest() {
    completeEl.classList.remove('show');
    sessionStartTime = null;
    sessionComplete = false;
    timerEl.textContent = '— : —';
    playBtn.textContent = '▶ Begin Quest';
    playBtn.classList.remove('active');
    audioMode = 'idle';
    hint.style.opacity = '1';
    affirmationEl.style.color = 'rgba(0,200,255,0)';
}

// Resize + mask
function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    const mc = document.createElement('canvas');
    mc.width = canvas.width; mc.height = canvas.height;
    const mctx = mc.getContext('2d');
    const sz = Math.min(canvas.width, canvas.height) * 0.72;
    mctx.fillStyle = '#fff';
    mctx.font = `900 ${sz}px sans-serif`;
    mctx.textAlign = 'center'; mctx.textBaseline = 'middle';
    mctx.fillText('8', canvas.width / 2, canvas.height / 2);
    const d = mctx.getImageData(0, 0, canvas.width, canvas.height).data;
    maskData = new Uint8Array(canvas.width * canvas.height);
    for (let i = 0; i < d.length; i += 4) maskData[i / 4] = d[i] > 128 ? 1 : 0;
    particles = [];
    for (let i = 0; i < N; i++) particles.push(new P(true));
}

class P {
    constructor(scattered) {
        this.color = rc(); this.reset();
        if (scattered) this.y = Math.random() * canvas.height;
    }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = -Math.random() * 60;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = Math.random() * 2.5 + 1.5;
        this.life = Math.random();
        this.color = rc();
    }
    update(boost) {
        let nx = this.x + this.vx, ny = this.y + this.vy + boost;
        if (ny > canvas.height || nx < 0 || nx > canvas.width) { this.reset(); return; }
        const idx = Math.floor(ny) * canvas.width + Math.floor(nx);
        if (maskData[idx] === 1) {
            this.vx += this.x < canvas.width / 2 ? -0.6 : 0.6;
            this.vy *= 0.92;
        } else { this.vx *= 0.97; }
        if (pointer.active) {
            const dx = this.x - pointer.x, dy = this.y - pointer.y;
            const dist = Math.sqrt(dx*dx + dy*dy), r = 160 * dpr;
            if (dist < r && dist > 0) {
                const f = (r - dist) / r;
                this.vx += (dx/dist)*f*2.5;
                this.vy += (dy/dist)*f*2.5;
            }
        }
        this.x += this.vx; this.y += this.vy + boost;
    }
    draw(intensity, pulse) {
        const [r,g,b] = this.color;
        const a = Math.min(1, 0.35 + this.life*0.4 + intensity*0.004 + pulse*0.3);
        const sz = (1.5 + intensity*0.012 + pulse*1.2) * dpr;
        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.beginPath(); ctx.arc(this.x, this.y, sz, 0, Math.PI*2); ctx.fill();
    }
}

function triggerSessionComplete() {
    sessionComplete = true;
    completeEl.classList.add('show');
    // Big cyan burst
    particles.forEach(p => {
        p.vx = (Math.random() - 0.5) * 20;
        p.vy = (Math.random() - 0.5) * 20;
        p.color = [0, 220, 255];
    });
    if (currentAudio) {
        setTimeout(() => {
            let vol = 1;
            const fade = setInterval(() => {
                vol -= 0.05;
                if (currentAudio) currentAudio.volume = Math.max(0, vol);
                if (vol <= 0) clearInterval(fade);
            }, 200);
        }, 2000);
    }
}

function animate() {
    requestAnimationFrame(animate);

    // Timer
    let elapsed = 0;
    if (sessionStartTime && !sessionComplete) {
        elapsed = (performance.now() - sessionStartTime) / 1000;
        const remaining = Math.max(0, SESSION_DURATION - elapsed);
        const m = Math.floor(remaining / 60);
        const s = Math.floor(remaining % 60);
        timerEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;
        timerEl.style.color = remaining < 30
            ? 'rgba(0,255,200,0.5)'
            : 'rgba(0,200,255,0.25)';

        // Affirmations every 30s
        affirmTimer += 1/60;
        if (affirmTimer >= AFFIRM_INTERVAL) {
            affirmTimer = 0;
            showAffirmation();
        }

        if (elapsed >= SESSION_DURATION) {
            triggerSessionComplete();
        }
    }

    // Audio
    if (audioMode !== 'idle' && analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < 12; i++) sum += dataArray[i];
        audioIntensity = sum / 12;
    } else {
        audioIntensity *= 0.9;
    }

    idleTime += 0.018;
    const pulse = audioMode === 'idle' ? (Math.sin(idleTime)*0.5+0.5) : 0;
    const boost = audioIntensity*0.04 + pulse*0.4;

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => { p.update(boost); p.draw(audioIntensity, pulse); });
    ctx.globalCompositeOperation = 'source-over';

    // Glow outline
    if (audioIntensity > 60 || pulse > 0.85) {
        const ga = audioMode !== 'idle'
            ? Math.min(0.65, (audioIntensity-60)/180)
            : (pulse-0.85)/0.15*0.3;
        const sz = Math.min(canvas.width, canvas.height)*0.72;
        ctx.save();
        ctx.globalAlpha = ga;
        ctx.strokeStyle = 'rgba(0,210,255,1)';
        ctx.lineWidth = 2*dpr;
        ctx.shadowColor = 'rgba(0,200,255,1)';
        ctx.shadowBlur = 40*dpr;
        ctx.font = `900 ${sz}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.strokeText('8', canvas.width/2, canvas.height/2);
        ctx.restore();
    }
}

window.addEventListener('resize', resize);
resize();
animate();
</script>
</body>
</html>
