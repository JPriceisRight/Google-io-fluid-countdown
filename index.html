<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SELF QUEST</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #brand {
            position: absolute; top: 40px; width: 100%;
            text-align: center; 
            color: rgba(0, 160, 220, 0.6); 
            font-size: 22px; letter-spacing: 12px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 180, 255, 0.2); 
            pointer-events: none; z-index: 10;
            text-transform: uppercase;
        }
        #timer {
            position: absolute; top: 80px; width: 100%;
            text-align: center; color: rgba(0,200,255,0.3);
            font-size: 14px; letter-spacing: 6px;
            pointer-events: none; z-index: 10;
        }
        #affirmation {
            position: absolute; top: 115px; left: 50%;
            transform: translateX(-50%);
            text-align: center; color: rgba(0,200,255,0);
            font-size: 13px; letter-spacing: 3px;
            pointer-events: none; z-index: 10;
            width: 90%; line-height: 1.6;
            transition: color 3s; text-transform: uppercase;
        }
        #controls {
            position: absolute; bottom: 65px; left: 50%;
            transform: translateX(-50%);
            display: flex; flex-direction: column; 
            gap: 15px; z-index: 20;
            align-items: center; width: 100%;
        }
        .btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0,200,255,0.4);
            color: rgba(0,200,255,0.8);
            font-family: 'Courier New', monospace;
            font-size: 11px; letter-spacing: 4px;
            padding: 14px 32px; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase;
            backdrop-filter: blur(5px);
        }
        .btn:hover { border-color: #fff; color: #fff; }
        .btn.active { border-color: rgba(0,255,200,0.8); color: rgba(0,255,200,1); }
        #hint {
            position: absolute; bottom: 20px; width: 100%;
            text-align: center; color: rgba(0,200,255,0.2);
            font-size: 9px; letter-spacing: 4px;
            pointer-events: none; z-index: 10;
            text-transform: uppercase;
        }
        #complete {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 30; pointer-events: none;
            opacity: 0; transition: opacity 3s;
            background: rgba(0,0,0,0.9);
        }
        #complete.show { opacity: 1; pointer-events: all; }
        #complete-text {
            color: rgba(0,210,255,0.8);
            font-size: 14px; letter-spacing: 6px;
            text-transform: uppercase;
            text-align: center; line-height: 2.5;
        }
        #replay-btn {
            margin-top: 40px; background: transparent;
            border: 1px solid rgba(0,200,255,0.4);
            color: rgba(0,200,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 10px; letter-spacing: 5px;
            padding: 12px 30px; cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="brand">SELF QUEST</div>
<div id="timer">04:15</div>
<div id="affirmation"></div>
<canvas id="c"></canvas>

<div id="controls">
    <button class="btn" id="play-btn">▶ Begin Quest</button>
    <button class="btn" id="calm-btn">🌙 Calm Mode</button>
</div>

<div id="hint">touch · move · breathe</div>

<div id="complete">
    <div id="complete-text">
        your quest is complete<br>
        carry this stillness with you<br>
        you are more than enough
    </div>
    <button id="replay-btn" onclick="replayQuest()">↺ Begin Again</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const playBtn = document.getElementById('play-btn');
const calmBtn = document.getElementById('calm-btn');
const timerEl = document.getElementById('timer');
const affirmationEl = document.getElementById('affirmation');
const completeEl = document.getElementById('complete');

let dpr, maskData = [], particles = [];
const N = 1800;
let analyser, dataArray, audioCtx;
let audioIntensity = 0, idleTime = 0;
let audioMode = 'idle';
let currentAudio = null;
let sessionStartTime = null;
let sessionComplete = false;
const SESSION_DURATION = 255;

// Glow stops after 3 seconds
const GLOW_DURATION = 3000;
let sessionStartMs = null;

let calmMode = false;
let pointer = { x: -9999, y: -9999, active: false };

const AFFIRMATIONS = [
    "you are exactly where you need to be",
    "this moment belongs to you",
    "let it pass · it always does",
    "you are stronger than you know",
    "breathe · release · return",
    "peace is already within you",
    "you are not your thoughts",
    "this too shall pass",
    "you are safe right now",
    "your mind is clearing",
    "you are more than enough",
    "one breath at a time",
    "you deserve this moment",
];

let affirmIndex = 0, affirmTimer = 0;
const AFFIRM_INTERVAL = 20;

const COLORS_NORMAL = [
    [0, 200, 255], [0, 150, 255], [80, 220, 255],
    [0, 255, 220], [100, 180, 255]
];
const COLORS_CALM = [
    [0, 120, 200], [0, 100, 180], [60, 160, 220],
    [0, 180, 160], [80, 130, 200]
];

const rc = () => {
    const p = calmMode ? COLORS_CALM : COLORS_NORMAL;
    return p[Math.floor(Math.random() * p.length)];
};

window.addEventListener('mousemove', e => {
    pointer.x = e.clientX * dpr;
    pointer.y = e.clientY * dpr;
    pointer.active = true;
});
window.addEventListener('mouseout', () => pointer.active = false);
window.addEventListener('touchmove', e => {
    e.preventDefault();
    pointer.x = e.touches[0].clientX * dpr;
    pointer.y = e.touches[0].clientY * dpr;
    pointer.active = true;
}, { passive: false });
window.addEventListener('touchend', () => pointer.active = false);

function enableCalmMode() {
    calmMode = true;
    calmBtn.textContent = '☀️ Normal Mode';
    calmBtn.classList.add('active');
    particles.forEach(p => p.color = rc());
}
function disableCalmMode() {
    calmMode = false;
    calmBtn.textContent = '🌙 Calm Mode';
    calmBtn.classList.remove('active');
    particles.forEach(p => p.color = rc());
}
calmBtn.addEventListener('click', () => calmMode ? disableCalmMode() : enableCalmMode());

playBtn.addEventListener('click', async () => {
    if (audioMode === 'track') {
        if (currentAudio) currentAudio.pause();
        audioMode = 'idle';
        playBtn.textContent = '▶ Begin Quest';
        playBtn.classList.remove('active');
        sessionStartTime = null;
        sessionStartMs = null;
        timerEl.textContent = '04:15';
        return;
    }
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        currentAudio = new Audio('808beat-4GSynth.mp3');
        currentAudio.crossOrigin = 'anonymous';
        currentAudio.loop = true;
        const source = audioCtx.createMediaElementSource(currentAudio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        await currentAudio.play();
        audioMode = 'track';
        sessionStartTime = performance.now();
        sessionStartMs = performance.now();
        sessionComplete = false;
        affirmIndex = 0;
        affirmTimer = 0;
        playBtn.textContent = '■ End Quest';
        playBtn.classList.add('active');
        showAffirmation();
    } catch(e) {
        playBtn.textContent = 'Audio Error';
        console.error(e);
    }
});

function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    const mc = document.createElement('canvas');
    mc.width = canvas.width; mc.height = canvas.height;
    const mctx = mc.getContext('2d');
    const sz = Math.min(canvas.width, canvas.height) * 0.72;
    mctx.fillStyle = '#fff';
    mctx.font = `900 ${sz}px sans-serif`;
    mctx.textAlign = 'center';
    mctx.textBaseline = 'middle';
    mctx.fillText('8', canvas.width / 2, canvas.height / 2);
    const d = mctx.getImageData(0, 0, canvas.width, canvas.height).data;
    maskData = new Uint8Array(canvas.width * canvas.height);
    for (let i = 0; i < d.length; i += 4) maskData[i/4] = d[i] > 128 ? 1 : 0;
    particles = [];
    for (let i = 0; i < N; i++) particles.push(new P(true));
}

class P {
    constructor(scattered) {
        this.color = rc();
        this.reset();
        if (scattered) this.y = Math.random() * canvas.height;
    }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = -Math.random() * 60;
        // Sweet spot — visible but slow and gentle
        this.vx = (Math.random() - 0.5) * (calmMode ? 0.4 : 0.8);
        this.vy = Math.random() * (calmMode ? 0.8 : 1.6) + (calmMode ? 0.5 : 1.0);
        this.life = Math.random();
        this.color = rc();
    }
    update(boost) {
        let nx = this.x + this.vx;
        let ny = this.y + this.vy + boost;
        if (ny > canvas.height || nx < 0 || nx > canvas.width) {
            this.reset(); return;
        }
        const idx = Math.floor(ny) * canvas.width + Math.floor(nx);
        if (maskData[idx] === 1) {
            this.vx += this.x < canvas.width / 2 ? -0.6 : 0.6;
            this.vy *= 0.92;
        } else {
            this.vx *= 0.97;
        }
        if (pointer.active) {
            const dx = this.x - pointer.x;
            const dy = this.y - pointer.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const r = 160 * dpr;
            if (dist < r && dist > 0) {
                const f = (r - dist) / r;
                const power = calmMode ? 1.2 : 2.5;
                this.vx += (dx / dist) * f * power;
                this.vy += (dy / dist) * f * power;
            }
        }
        this.x += this.vx;
        this.y += this.vy + boost;
    }
    draw(intensity, pulse) {
        const [r, g, b] = this.color;
        const a = Math.min(1, 0.35 + this.life * 0.4 + intensity * 0.004 + pulse * 0.3);
        // Sweet spot size — small but visible
        const sz = (1.0 + intensity * 0.008 + pulse * 0.8) * dpr;
        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, sz, 0, Math.PI * 2);
        ctx.fill();
    }
}

function showAffirmation() {
    const text = AFFIRMATIONS[affirmIndex % AFFIRMATIONS.length];
    affirmationEl.style.color = calmMode
        ? 'rgba(150,180,255,0.45)'
        : 'rgba(0,210,255,0.5)';
    affirmationEl.textContent = text;
    setTimeout(() => {
        affirmationEl.style.color = 'rgba(0,200,255,0)';
    }, 5000);
    affirmIndex++;
}

function replayQuest() {
    completeEl.classList.remove('show');
    sessionStartTime = null;
    sessionStartMs = null;
    sessionComplete = false;
    timerEl.textContent = '04:15';
    playBtn.textContent = '▶ Begin Quest';
    playBtn.classList.remove('active');
    audioMode = 'idle';
    affirmationEl.style.color = 'rgba(0,200,255,0)';
}

function triggerSessionComplete() {
    sessionComplete = true;
    completeEl.classList.add('show');
    // Gentle particle burst at end
    particles.forEach(p => {
        p.vx = (Math.random() - 0.5) * (calmMode ? 6 : 14);
        p.vy = (Math.random() - 0.5) * (calmMode ? 6 : 14);
        p.color = calmMode ? [80, 150, 220] : [0, 220, 255];
    });
    // Fade music out
    if (currentAudio) {
        setTimeout(() => {
            let vol = 1;
            const fade = setInterval(() => {
                vol -= 0.05;
                if (currentAudio) currentAudio.volume = Math.max(0, vol);
                if (vol <= 0) clearInterval(fade);
            }, 200);
        }, 2000);
    }
}

function animate() {
    requestAnimationFrame(animate);

    if (sessionStartTime && !sessionComplete) {
        const elapsed = (performance.now() - sessionStartTime) / 1000;
        const remaining = Math.max(0, SESSION_DURATION - elapsed);
        const m = Math.floor(remaining / 60);
        const s = Math.floor(remaining % 60);
        timerEl.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        affirmTimer += 1/60;
        if (affirmTimer >= AFFIRM_INTERVAL) { affirmTimer = 0; showAffirmation(); }
        if (elapsed >= SESSION_DURATION) triggerSessionComplete();
    }

    if (audioMode !== 'idle' && analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < 12; i++) sum += dataArray[i];
        audioIntensity = sum / 12;
    } else {
        audioIntensity *= 0.9;
    }

    idleTime += calmMode ? 0.008 : 0.018;
    const pulse = audioMode === 'idle' ? (Math.sin(idleTime) * 0.5 + 0.5) : 0;
    const boost = audioIntensity * (calmMode ? 0.02 : 0.04) + pulse * (calmMode ? 0.2 : 0.4);

    ctx.fillStyle = calmMode ? 'rgba(0,0,0,0.14)' : 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => { p.update(boost); p.draw(audioIntensity, pulse); });
    ctx.globalCompositeOperation = 'source-over';

    // Glow outline — only first 3 seconds
    const glowWindowOpen = sessionStartMs && (performance.now() - sessionStartMs) < GLOW_DURATION;
    if (!calmMode && glowWindowOpen && (audioIntensity > 60 || pulse > 0.85)) {
        const ga = audioMode !== 'idle'
            ? Math.min(0.65, (audioIntensity - 60) / 180)
            : (pulse - 0.85) / 0.15 * 0.3;
        const sz = Math.min(canvas.width, canvas.height) * 0.72;
        ctx.save();
        ctx.globalAlpha = ga;
        ctx.strokeStyle = 'rgba(0,210,255,1)';
        ctx.lineWidth = 2 * dpr;
        ctx.shadowColor = 'rgba(0,200,255,1)';
        ctx.shadowBlur = 40 * dpr;
        ctx.font = `900 ${sz}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeText('8', canvas.width / 2, canvas.height / 2);
        ctx.restore();
    }
}

window.addEventListener('resize', resize);
resize();
animate();
</script>
</body>
</html>
