<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SELF QUEST</title>
    <link rel="manifest" href="site.webmanifest">
    <meta property="og:title" content="SELF QUEST">
    <meta property="og:description" content="A gentle tool for relaxation and focus.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://selfquest.app">
    <meta property="og:image" content="https://selfquest.app/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Self Quest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="apple-touch-icon.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #brand {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            text-align: center;
            font-family: 'Arial Rounded MT Bold', 'Nunito', 'Arial Black', sans-serif;
            font-size: clamp(64px, 18vw, 120px);
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 0.95;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.5s ease;
            white-space: nowrap;
            color: rgb(80, 250, 240);
            text-shadow:
                0 0 4px rgba(150, 255, 250, 1),
                0 0 12px rgba(80, 240, 230, 0.85),
                0 0 24px rgba(0, 200, 200, 0.4);
        }
        #brand.hidden { opacity: 0; }

        #timer {
            position: absolute; top: 36px; width: 100%;
            text-align: center;
            color: rgba(129, 216, 208, 0.4);
            font-size: 13px;
            letter-spacing: 8px;
            pointer-events: none;
            z-index: 15;
        }

        #affirmation {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(129, 216, 208, 0);
            font-size: 15px; letter-spacing: 4px;
            pointer-events: none; z-index: 20;
            width: 85%; line-height: 2.2;
            transition: color 2s, opacity 2s;
            text-transform: uppercase;
            text-shadow:
                0 0 12px rgba(129, 216, 208, 1),
                0 0 26px rgba(129, 216, 208, 0.6);
        }

        #controls {
            position: absolute; bottom: 65px; left: 50%;
            transform: translateX(-50%);
            display: flex; flex-direction: column;
            gap: 15px; z-index: 20;
            align-items: center; width: 100%;
        }
        .btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            color: rgba(129, 216, 208, 1);
            font-family: 'Courier New', monospace;
            font-size: 12px; letter-spacing: 5px;
            padding: 16px 44px; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase;
            backdrop-filter: blur(8px);
            text-shadow: 0 0 10px rgba(129, 216, 208, 0.8);
            box-shadow: 0 0 14px rgba(129, 216, 208, 0.15);
            min-width: 260px;
        }
        .btn:hover {
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 24px rgba(129, 216, 208, 0.5);
        }
        .btn.active {
            border-color: rgba(57, 255, 20, 0.9);
            color: rgba(57, 255, 20, 1);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.8);
            box-shadow: 0 0 22px rgba(57, 255, 20, 0.35);
        }

        #hint {
            position: absolute; bottom: 20px; width: 100%;
            text-align: center; color: rgba(129, 216, 208, 0.22);
            font-size: 9px; letter-spacing: 4px;
            pointer-events: none; z-index: 15;
            text-transform: uppercase;
            transition: opacity 2s;
        }

        #complete {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 30; pointer-events: none;
            opacity: 0; transition: opacity 3s;
            background: rgba(0,0,0,0.92);
        }
        #complete.show { opacity: 1; pointer-events: all; }
        #complete-text {
            color: rgba(129, 216, 208, 0.95);
            font-size: 14px; letter-spacing: 6px;
            text-transform: uppercase;
            text-align: center;
            line-height: 3.2;
            text-shadow: 0 0 18px rgba(129, 216, 208, 0.6);
        }
        #replay-btn {
            margin-top: 40px; background: transparent;
            border: 1.5px solid rgba(255,255,255,0.65);
            color: rgba(129, 216, 208, 1);
            font-family: 'Courier New', monospace;
            font-size: 11px; letter-spacing: 5px;
            padding: 14px 32px; cursor: pointer;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(129, 216, 208, 0.5);
        }
        #replay-btn:hover { border-color: #fff; color: #fff; }

        #small-doses {
            position: absolute; bottom: 6px; right: 16px;
            color: rgba(129, 216, 208, 0.1);
            font-size: 8px; letter-spacing: 3px;
            pointer-events: none; z-index: 15;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<canvas id="c"></canvas>
<div id="brand">SELF<br>QUEST</div>
<div id="timer">04:15</div>
<div id="affirmation"></div>

<div id="controls">
    <button class="btn" id="play-btn">▶ Begin Quest</button>
    <button class="btn" id="calm-btn">🌙 Calm Mode</button>
</div>
<div id="hint">touch · move · breathe</div>
<div id="small-doses">Small Doses</div>

<div id="complete">
    <div id="complete-text">
        your quest is complete<br>
        keep this with you<br>
        you are more than enough
    </div>
    <button id="replay-btn" onclick="replayQuest()">↺ Begin Again</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const playBtn = document.getElementById('play-btn');
const calmBtn = document.getElementById('calm-btn');
const timerEl = document.getElementById('timer');
const affirmationEl = document.getElementById('affirmation');
const completeEl = document.getElementById('complete');
const hintEl = document.getElementById('hint');
const brandEl = document.getElementById('brand');

let dpr;
let particles = [];
const N = 220; // Fewer stars — spaced out and elegant

let analyser, dataArray, audioCtx;
let audioIntensity = 0;
let smoothIntensity = 0;
let idleTime = 0;
let audioMode = 'idle';
let currentAudio = null;
let sessionStartTime = null;
let sessionComplete = false;
const SESSION_DURATION = 255;

let showingGoText = false;
let goTextStartTime = 0;
const GO_TEXT_DURATION = 2000;

let calmMode = false;
let pointer = { x: -9999, y: -9999, active: false };

// Affirmation repulsion + fade
let affirmationVisible = false;
let affirmationFading = false; // true when particles are fading out for affirmation
let particleOpacity = 1.0;     // global fade multiplier for stars
let affirmationRect = null;

const AFFIRMATIONS = [
    "you are exactly where you need to be",
    "this moment belongs to you",
    "let it pass · it always does",
    "you are stronger than you know",
    "breathe · release · return",
    "peace is already within you",
    "you are not your thoughts",
    "this too shall pass",
    "you are safe right now",
    "your mind is clearing",
    "you are more than enough",
    "one breath at a time",
    "you deserve this moment",
];
let affirmIndex = 0, affirmTimer = 0;
const AFFIRM_INTERVAL = 30;

// 6 songs
const SONG_PLAYLIST = [
    '808beat-4GSynthG1.mp3',
    '809beat-nightrider.mp3',
    '810beat-dejavuagain.mp3',
    '811beat-909instrumental.mp3',
    '812beat-kingofdaho.mp3',
    '813beat-21jazzstreet.mp3'
];

function getRandomSong() {
    return SONG_PLAYLIST[Math.floor(Math.random() * SONG_PLAYLIST.length)];
}

// NORMAL — bright solid Tiffany blue / cyan only (no white)
const COLORS_NORMAL = [
    [0,   242, 255],  // bright cyan
    [0,   230, 255],  // ice blue
    [80,  250, 240],  // Tiffany
    [0,   255, 230],  // neon teal
    [0,   210, 250],  // sky cyan
    [100, 255, 245],  // pale Tiffany
];

// CALM — Matrix neon green
const COLORS_CALM = [
    [0,   255, 65],
    [57,  255, 20],
    [120, 255, 100],
    [0,   255, 65],
    [180, 255, 160],
    [0,   255, 130],
];

const rc = () => {
    const p = calmMode ? COLORS_CALM : COLORS_NORMAL;
    return p[Math.floor(Math.random() * p.length)];
};

window.addEventListener('mousemove', e => {
    pointer.x = e.clientX * dpr; pointer.y = e.clientY * dpr; pointer.active = true;
});
window.addEventListener('mouseout', () => pointer.active = false);
window.addEventListener('touchmove', e => {
    e.preventDefault();
    pointer.x = e.touches[0].clientX * dpr;
    pointer.y = e.touches[0].clientY * dpr;
    pointer.active = true;
}, { passive: false });
window.addEventListener('touchend', () => pointer.active = false);

function enableCalmMode() {
    calmMode = true;
    calmBtn.textContent = '☀️ Normal Mode';
    calmBtn.classList.add('active');
    particles.forEach(p => p.color = rc());
}
function disableCalmMode() {
    calmMode = false;
    calmBtn.textContent = '🌙 Calm Mode';
    calmBtn.classList.remove('active');
    particles.forEach(p => p.color = rc());
}
calmBtn.addEventListener('click', () => calmMode ? disableCalmMode() : enableCalmMode());

playBtn.addEventListener('click', async () => {
    if (audioMode === 'track') {
        if (currentAudio) currentAudio.pause();
        audioMode = 'idle';
        playBtn.textContent = '▶ Begin Quest';
        playBtn.classList.remove('active');
        sessionStartTime = null;
        timerEl.textContent = '04:15';
        hintEl.style.opacity = '1';
        brandEl.classList.remove('hidden');
        showingGoText = false;
        particleOpacity = 1.0;
        return;
    }
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512; // larger fftSize = more frequency detail = better reactivity
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        const randomSong = getRandomSong();
        currentAudio = new Audio(randomSong);
        currentAudio.crossOrigin = 'anonymous';
        currentAudio.loop = false;
        const source = audioCtx.createMediaElementSource(currentAudio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        await currentAudio.play();
        audioMode = 'track';
        sessionStartTime = performance.now();
        sessionComplete = false;
        affirmIndex = 0; affirmTimer = 0;
        playBtn.textContent = '■ End Quest';
        playBtn.classList.add('active');
        hintEl.style.opacity = '0';

        showingGoText = true;
        goTextStartTime = performance.now();
        setTimeout(() => brandEl.classList.add('hidden'), 1800);
        setTimeout(() => showAffirmation(), 3500);
    } catch(e) {
        playBtn.textContent = 'Audio Error';
        console.error(e);
    }
});

function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    particles = [];
    for (let i = 0; i < N; i++) particles.push(new Star(true));
}

// ── STAR class — elegant slow falling streaks ──────────────────────────────
class Star {
    constructor(scattered) {
        this.color = rc();
        this.reset();
        if (scattered) this.y = Math.random() * canvas.height;
    }

    reset() {
        this.x  = Math.random() * canvas.width;
        this.y  = -Math.random() * canvas.height * 0.3;

        // Very slow drift — elegant, not rain
        const speed = calmMode
            ? Math.random() * 0.18 + 0.08   // calm: ultra slow
            : Math.random() * 0.28 + 0.12;  // normal: still gentle

        // Slight angle — stars drift a little sideways
        const angle = (Math.random() - 0.5) * 0.35; // subtle diagonal
        this.vx = Math.sin(angle) * speed;
        this.vy = Math.cos(angle) * speed + speed * 0.5;

        // Tail length — varies per star for organic feel
        this.tail = Math.random() * (calmMode ? 18 : 28) + 8;

        // Glow size
        this.glow = Math.random() * 1.2 + 0.4;

        this.life  = Math.random();
        this.color = rc();
        this.twinkle = Math.random() * Math.PI * 2; // offset for twinkle
    }

    update(boost, musicPulse) {
        this.twinkle += 0.04;

        // Music reactivity — stars speed up and grow on beats
        const beatBoost = 1 + musicPulse * 2.5;

        this.x += this.vx * beatBoost;
        this.y += (this.vy + boost) * beatBoost;

        if (this.y > canvas.height + this.tail) {
            this.reset();
            return;
        }
        if (this.x < 0 || this.x > canvas.width) {
            this.vx *= -0.6;
        }

        // Affirmation repulsion — stars gently float away from text
        if (affirmationVisible && affirmationRect) {
            const dx = this.x - affirmationRect.cx;
            const dy = this.y - affirmationRect.cy;
            if (Math.abs(dx) < affirmationRect.rw && Math.abs(dy) < affirmationRect.rh) {
                const dist = Math.sqrt(dx*dx + dy*dy) || 1;
                const strength = Math.min(affirmationRect.rw, affirmationRect.rh);
                const force = (1 - Math.min(1, dist/strength)) * 1.2;
                this.vx += (dx/dist) * force * 0.3;
                this.vy += (dy/dist) * force * 0.3;
            }
        }

        // Pointer repulsion
        if (pointer.active) {
            const dx = this.x - pointer.x, dy = this.y - pointer.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const r = 180 * dpr;
            if (dist < r && dist > 0) {
                const f = (r - dist) / r;
                this.vx += (dx/dist) * f * (calmMode ? 1.0 : 2.2);
                this.vy += (dy/dist) * f * (calmMode ? 1.0 : 2.2);
            }
        }

        // Dampen vx so stars don't fly sideways forever
        this.vx *= 0.97;

        // Minimum fall speed
        const minFall = calmMode ? 0.08 : 0.12;
        if (this.vy < minFall) this.vy = minFall;
    }

    draw(intensity, pulse) {
        const [r, g, b] = this.color;

        // Twinkle brightness
        const twinkleFactor = 0.85 + Math.sin(this.twinkle) * 0.15;

        // Alpha — stronger base, brightens clearly with music
        const musicGlow = intensity * 0.012; // noticeable music response
        const a = Math.min(1, (0.55 + this.life * 0.35 + musicGlow + pulse * 0.25) * twinkleFactor * particleOpacity);

        // Star head — glowing dot
        const headR = (this.glow + intensity * 0.025 + pulse * 0.4) * dpr;
        ctx.beginPath();
        ctx.arc(this.x, this.y, headR, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.fill();

        // Tail — line trailing upward from star head
        const tailLen = (this.tail + intensity * 0.4 + pulse * 8) * dpr;
        const grad = ctx.createLinearGradient(
            this.x, this.y,
            this.x - this.vx * tailLen * 6,
            this.y - this.vy * tailLen * 6
        );
        grad.addColorStop(0, `rgba(${r},${g},${b},${a * 0.7})`);
        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);

        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(
            this.x - this.vx * tailLen * 6,
            this.y - this.vy * tailLen * 6
        );
        ctx.strokeStyle = grad;
        ctx.lineWidth = (0.8 + pulse * 0.4) * dpr;
        ctx.stroke();
    }
}

function showAffirmation() {
    if (sessionComplete) return;
    const text = AFFIRMATIONS[affirmIndex % AFFIRMATIONS.length];

    const waitForBeat = () => {
        if (audioIntensity > 10 || audioMode === 'idle') {

            // Fade stars out before showing text
            affirmationFading = true;
            const fadeOut = setInterval(() => {
                particleOpacity -= 0.06;
                if (particleOpacity <= 0.08) {
                    particleOpacity = 0.08;
                    clearInterval(fadeOut);

                    // Show affirmation text once stars have faded
                    affirmationEl.style.transition = 'color 1.5s, opacity 1.5s';
                    affirmationEl.style.opacity = '1';
                    affirmationEl.style.color = calmMode
                        ? 'rgba(150, 255, 130, 1)'
                        : 'rgba(129, 216, 208, 1)';
                    affirmationEl.textContent = text;
                    affirmationVisible = true;
                    updateAffirmationRect();

                    // After 6 seconds, fade text out then fade stars back in
                    setTimeout(() => {
                        affirmationEl.style.transition = 'color 2.5s, opacity 2.5s';
                        affirmationEl.style.color = 'rgba(129, 216, 208, 0)';
                        affirmationEl.style.opacity = '0';

                        setTimeout(() => {
                            affirmationVisible = false;
                            affirmationFading = false;
                            // Fade stars back in
                            const fadeIn = setInterval(() => {
                                particleOpacity += 0.04;
                                if (particleOpacity >= 1.0) {
                                    particleOpacity = 1.0;
                                    clearInterval(fadeIn);
                                }
                            }, 30);
                        }, 2500);
                    }, 6000);
                }
            }, 30);

        } else {
            setTimeout(waitForBeat, 100);
        }
    };
    waitForBeat();
    affirmIndex++;
}

function updateAffirmationRect() {
    const rect = affirmationEl.getBoundingClientRect();
    affirmationRect = {
        cx: (rect.left + rect.width / 2) * dpr,
        cy: (rect.top + rect.height / 2) * dpr,
        rw: (rect.width / 2 + 40) * dpr,
        rh: (rect.height / 2 + 30) * dpr,
    };
}

function replayQuest() {
    completeEl.classList.remove('show');
    sessionStartTime = null; sessionComplete = false;
    timerEl.textContent = '04:15';
    playBtn.textContent = '▶ Begin Quest';
    playBtn.classList.remove('active');
    audioMode = 'idle';
    hintEl.style.opacity = '1';
    affirmationEl.style.color = 'rgba(129, 216, 208, 0)';
    affirmationEl.style.opacity = '0';
    affirmationVisible = false;
    affirmationFading = false;
    particleOpacity = 1.0;
    showingGoText = false;
    brandEl.classList.remove('hidden');
    particles.forEach(p => p.reset());
}

function triggerSessionComplete() {
    sessionComplete = true;
    completeEl.classList.add('show');
    particles.forEach(p => {
        p.vx = (Math.random() - 0.5) * (calmMode ? 3 : 6);
        p.vy = (Math.random() - 0.5) * (calmMode ? 3 : 6);
        p.color = calmMode ? [0, 255, 65] : [0, 242, 255];
    });
    if (currentAudio) {
        setTimeout(() => {
            let vol = 1;
            const fade = setInterval(() => {
                vol -= 0.05;
                if (currentAudio) currentAudio.volume = Math.max(0, vol);
                if (vol <= 0) clearInterval(fade);
            }, 200);
        }, 2000);
    }
}

function drawGoText() {
    const elapsed = performance.now() - goTextStartTime;
    if (elapsed < GO_TEXT_DURATION) {
        const progress = elapsed / GO_TEXT_DURATION;
        const sz = Math.min(canvas.width, canvas.height) * 0.18;
        ctx.save();
        let alpha;
        if (progress < 0.2) alpha = progress / 0.2;
        else if (progress < 0.65) alpha = 1;
        else alpha = 1 - (progress - 0.65) / 0.35;
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.font = `900 ${sz}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(57, 255, 20, 1)';
        ctx.shadowBlur = 40 * dpr;
        ctx.strokeStyle = 'rgba(57, 255, 20, 1)';
        ctx.lineWidth = 3 * dpr;
        ctx.strokeText('Go!', canvas.width / 2, canvas.height / 2);
        ctx.shadowBlur = 12 * dpr;
        ctx.fillStyle = 'rgba(100, 255, 60, 0.95)';
        ctx.fillText('Go!', canvas.width / 2, canvas.height / 2);
        ctx.restore();
    } else {
        showingGoText = false;
    }
}

function animate() {
    requestAnimationFrame(animate);

    if (audioMode !== 'idle' && analyser) {
        analyser.getByteFrequencyData(dataArray);

        // Use bass + mid frequencies for a fuller music response
        let bassSum = 0, midSum = 0;
        for (let i = 0; i < 10; i++) bassSum += dataArray[i];       // bass
        for (let i = 10; i < 40; i++) midSum += dataArray[i];       // mids
        audioIntensity = (bassSum / 10) * 0.7 + (midSum / 30) * 0.3;
    } else {
        audioIntensity *= 0.92;
    }

    smoothIntensity += (audioIntensity - smoothIntensity) * 0.15;

    if (sessionStartTime && !sessionComplete) {
        const elapsed = (performance.now() - sessionStartTime) / 1000;
        const remaining = Math.max(0, SESSION_DURATION - elapsed);
        const m = Math.floor(remaining / 60);
        const s = Math.floor(remaining % 60);
        timerEl.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        affirmTimer += 1 / 60;
        if (affirmTimer >= AFFIRM_INTERVAL) { affirmTimer = 0; showAffirmation(); }
        if (elapsed >= SESSION_DURATION) triggerSessionComplete();
    }

    if (affirmationVisible) updateAffirmationRect();

    idleTime += calmMode ? 0.006 : 0.014;
    const pulse = audioMode === 'idle' ? (Math.sin(idleTime) * 0.5 + 0.5) : 0;

    // Music pulse — normalized 0–1 for star reactivity
    const musicPulse = Math.min(1, smoothIntensity / 80);

    // Gentle fall boost from music
    const boost = smoothIntensity * (calmMode ? 0.018 : 0.035) + pulse * (calmMode ? 0.06 : 0.1);

    // Slow trail for stars — longer persistence = more elegant streaks
    ctx.fillStyle = calmMode ? 'rgba(0,0,0,0.22)' : 'rgba(0,0,0,0.20)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => { p.update(boost, musicPulse); p.draw(smoothIntensity, pulse); });
    ctx.globalCompositeOperation = 'source-over';

    if (showingGoText) drawGoText();
}

window.addEventListener('resize', resize);
resize();
animate();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
</body>
</html>
