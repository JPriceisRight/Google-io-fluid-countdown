<html lang="en">

    <meta charset="UTF-8">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none;
        }
        canvas { display: block; width: 100%; height: 100%; }

        #center-logo {
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            width: 280px; 
            pointer-events: none; z-index: 5;
            transition: opacity 2s ease-in-out;
        }
        #center-logo.hidden { opacity: 0; }
        
        #brand {
            position: absolute; top: 40px; width: 100%;
            text-align: center;
            color: rgba(129, 216, 208, 1); 
            font-size: 32px; 
            letter-spacing: 12px;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(129, 216, 208, 0.6), 0 0 24px rgba(129, 216, 208, 0.3);
            pointer-events: none; z-index: 10;
            text-transform: uppercase;
        }
        
        #timer {
            position: absolute; top: 95px; width: 100%;
            text-align: center; 
            color: rgba(129, 216, 208, 0.8);
            font-size: 18px; 
            letter-spacing: 8px;
            text-shadow: 0 0 8px rgba(129, 216, 208, 0.4);
            pointer-events: none; z-index: 10;
        }
        
        #affirmation {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; color: rgba(0,200,255,0);
            font-size: 14px; letter-spacing: 4px;
            pointer-events: none; z-index: 10;
            width: 85%; line-height: 2;
            transition: color 2s, opacity 2s;
            text-transform: uppercase;
        }
        
        #controls {
            position: absolute; bottom: 65px; left: 50%;
            transform: translateX(-50%);
            display: flex; flex-direction: column;
            gap: 15px; z-index: 20;
            align-items: center; width: 100%;
        }
        .btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0,200,255,0.4);
            color: rgba(0,200,255,0.8);
            font-family: 'Courier New', monospace;
            font-size: 11px; letter-spacing: 4px;
            padding: 14px 32px; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase;
            backdrop-filter: blur(5px);
        }
        .btn:hover { border-color: #fff; color: #fff; }
        .btn.active { border-color: rgba(0,255,200,0.8); color: rgba(0,255,200,1); }
        
        #hint {
            position: absolute; bottom: 20px; width: 100%;
            text-align: center; color: rgba(0,200,255,0.2);
            font-size: 9px; letter-spacing: 4px;
            pointer-events: none; z-index: 10;
            text-transform: uppercase;
            transition: opacity 2s;
        }
        #complete {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 30; pointer-events: none;
            opacity: 0; transition: opacity 3s;
            background: rgba(0,0,0,0.9);
        }
        #complete.show { opacity: 1; pointer-events: all; }
        #complete-text {
            color: rgba(0,210,255,0.8);
            font-size: 13px; letter-spacing: 5px;
            text-transform: uppercase;
            text-align: center;
            line-height: 3.2;
        }
        #replay-btn {
            margin-top: 40px; background: transparent;
            border: 1px solid rgba(0,200,255,0.4);
            color: rgba(0,200,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 10px; letter-spacing: 5px;
            padding: 12px 30px; cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="brand">SELF QUEST</div>
<div id="timer">01:45</div>
<div id="affirmation"></div>
<img id="center-logo" src="apple-touch-icon.png" alt="Self Quest Logo">
<canvas id="c"></canvas>

<div id="controls">
    <button class="btn" id="play-btn">▶ Begin Quest</button>
    <button class="btn" id="calm-btn">🌙 Calm Mode</button>
</div>
<div id="hint">touch · move · breathe</div>

<div id="complete">
    <div id="complete-text">
        your quest is complete<br>
        keep this with you<br>
        you are more than enough
    </div>
    <button id="replay-btn" onclick="replayQuest()">↺ Begin Again</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const playBtn = document.getElementById('play-btn');
const calmBtn = document.getElementById('calm-btn');
const timerEl = document.getElementById('timer');
const affirmationEl = document.getElementById('affirmation');
const completeEl = document.getElementById('complete');
const hintEl = document.getElementById('hint');

let dpr;
let particles = [];
const N = 2000;

let analyser, dataArray, audioCtx;
let audioIntensity = 0, idleTime = 0;
let audioMode = 'idle';
let currentAudio = null;
let sessionStartTime = null;
let sessionComplete = false;

const SESSION_DURATION = 105; 

let showingGoText = false;
let goTextStartTime = 0;
const GO_TEXT_DURATION = 1500;

let calmMode = false;
let pointer = { x: -9999, y: -9999, active: false };

const AFFIRMATIONS = [
    "you are exactly where you need to be",
    "this moment belongs to you",
    "let it pass · it always does",
    "you are stronger than you know",
    "breathe · release · return",
    "peace is already within you",
    "you are not your thoughts",
    "this too shall pass",
    "you are safe right now",
    "your mind is clearing",
    "you are more than enough",
    "one breath at a time",
    "you deserve this moment",
];
let affirmIndex = 0, affirmTimer = 0;
const AFFIRM_INTERVAL = 15;

const COLORS_NORMAL = [
    [129, 216, 208], // Pure Tiffany Blue
    [0, 255, 230],   // Electric Cyan
    [0, 200, 255]    // Deep Aqua
];
const COLORS_CALM = [
    [109, 196, 188], 
    [0, 180, 160],   
    [40, 180, 180]    
];

const rc = () => {
    const p = calmMode ? COLORS_CALM : COLORS_NORMAL;
    return p[Math.floor(Math.random() * p.length)];
};

window.addEventListener('mousemove', e => {
    pointer.x = e.clientX * dpr; pointer.y = e.clientY * dpr; pointer.active = true;
});
window.addEventListener('mouseout', () => pointer.active = false);
window.addEventListener('touchmove', e => {
    e.preventDefault();
    pointer.x = e.touches[0].clientX * dpr;
    pointer.y = e.touches[0].clientY * dpr;
    pointer.active = true;
}, { passive: false });
window.addEventListener('touchend', () => pointer.active = false);

function enableCalmMode() {
    calmMode = true; calmBtn.textContent = '☀️ Normal Mode';
    calmBtn.classList.add('active'); particles.forEach(p => p.color = rc());
}
function disableCalmMode() {
    calmMode = false; calmBtn.textContent = '🌙 Calm Mode';
    calmBtn.classList.remove('active'); particles.forEach(p => p.color = rc());
}
calmBtn.addEventListener('click', () => calmMode ? disableCalmMode() : enableCalmMode());

playBtn.addEventListener('click', async () => {
    if (audioMode === 'track') {
        if (currentAudio) currentAudio.pause();
        audioMode = 'idle';
        playBtn.textContent = '▶ Begin Quest';
        playBtn.classList.remove('active');
        sessionStartTime = null;
        timerEl.textContent = '01:45';
        hintEl.style.opacity = '1';
        showingGoText = false;
        document.getElementById('center-logo').classList.remove('hidden');
        return;
    }
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        
        currentAudio = new Audio('808beat-4GSynthG.mp3');
        currentAudio.crossOrigin = 'anonymous';
        currentAudio.loop = false;
        
        const source = audioCtx.createMediaElementSource(currentAudio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        await currentAudio.play();
        audioMode = 'track';
        sessionStartTime = performance.now();
        sessionComplete = false;
        
        showingGoText = true;
        goTextStartTime = performance.now();
        document.getElementById('center-logo').classList.add('hidden');
        
        affirmIndex = 0; affirmTimer = 0;
        playBtn.textContent = '■ End Quest';
        playBtn.classList.add('active');
        hintEl.style.opacity = '0';
        
        setTimeout(() => showAffirmation(), 3000);
    } catch(e) {
        playBtn.textContent = 'Audio Error';
        console.error(e);
    }
});

function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    particles = [];
    for (let i = 0; i < N; i++) particles.push(new P(true));
}

class P {
    constructor(scattered) {
        this.color = rc(); this.reset();
        if (scattered) this.y = Math.random() * canvas.height;
    }
    
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = -Math.random() * canvas.height * 0.5;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = Math.random() * (calmMode ? 0.2 : 0.4) + (calmMode ? 0.2 : 0.3); 
        this.life = Math.random();
        this.color = rc();
    }
    
    update(boost) {
        const targetVy = calmMode ? 0.3 : 0.5; 
        this.vy += (targetVy - this.vy) * 0.05; 
        this.vx *= 0.88; 
        
        if (pointer.active) {
            const dx = this.x - pointer.x, dy = this.y - pointer.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const r = 160 * dpr; 
            
            if (dist < r && dist > 0) {
                const f = (r - dist) / r;
                this.vx += (dx/dist) * f * (calmMode ? 2 : 6);
                this.vy += (dy/dist) * f * (calmMode ? 2 : 6);
            }
        }
        
        this.x += this.vx;
        this.y += this.vy + (boost * 0.5); 

        if (this.y > canvas.height + 20 || this.y < -150 || this.x < -50 || this.x > canvas.width + 50) {
            this.reset();
            this.y = -20; 
        }
    }
    
    draw(intensity, pulse) {
        const [r, g, b] = this.color;
        const a = Math.min(1, 0.4 + this.life*0.45 + intensity*0.003 + pulse*0.2);
        const sz = (0.6 + intensity*0.003 + pulse*0.4) * dpr; 
        
        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, sz, 0, Math.PI*2);
        ctx.fill();
    }
}

function showAffirmation() {
    if (sessionComplete) return;
    const text = AFFIRMATIONS[affirmIndex % AFFIRMATIONS.length];
    const waitForBeat = () => {
        if (audioIntensity > 40 || audioMode === 'idle') {
            affirmationEl.style.transition = 'color 1.5s, opacity 1.5s';
            affirmationEl.style.opacity = '1';
            affirmationEl.style.color = calmMode ? 'rgba(150,180,255,0.55)' : 'rgba(0,210,255,0.65)';
            affirmationEl.textContent = text;
            setTimeout(() => {
                affirmationEl.style.transition = 'color 2.5s, opacity 2.5s';
                affirmationEl.style.color = 'rgba(0,200,255,0)';
                affirmationEl.style.opacity = '0';
            }, 5000);
        } else {
            setTimeout(waitForBeat, 100);
        }
    };
    waitForBeat();
    affirmIndex++;
}

function replayQuest() {
    document.getElementById('center-logo').classList.remove('hidden');
    completeEl.classList.remove('show');
    sessionStartTime = null; sessionComplete = false;
    timerEl.textContent = '01:45';
    playBtn.textContent = '▶ Begin Quest';
    playBtn.classList.remove('active');
    audioMode = 'idle';
    hintEl.style.opacity = '1';
    affirmationEl.style.color = 'rgba(0,200,255,0)';
    affirmationEl.style.opacity = '0';
    showingGoText = false;
    particles.forEach(p => p.reset());
}

function triggerSessionComplete() {
    sessionComplete = true;
    completeEl.classList.add('show');
    particles.forEach(p => {
        p.vx = (Math.random()-0.5)*(calmMode ? 6 : 14);
        p.vy = (Math.random()-0.5)*(calmMode ? 6 : 14);
        p.color = calmMode ? [80,150,220] : [0,220,255];
    });
    if (currentAudio) {
        setTimeout(() => {
            let vol = 1;
            const fade = setInterval(() => {
                vol -= 0.05;
                if (currentAudio) currentAudio.volume = Math.max(0, vol);
                if (vol <= 0) clearInterval(fade);
            }, 200);
        }, 2000);
    }
}

function drawGoText() {
    const elapsed = performance.now() - goTextStartTime;
    if (elapsed < GO_TEXT_DURATION) {
        const progress = elapsed / GO_TEXT_DURATION;
        const sz = Math.min(canvas.width, canvas.height) * 0.25;
        
        ctx.save();
        const alpha = Math.max(0, 1 - progress);
        ctx.globalAlpha = alpha;
        
        ctx.strokeStyle = 'rgba(57, 255, 20, 1)';     
        ctx.shadowColor = 'rgba(57, 255, 20, 0.3)';   
        
        ctx.lineWidth = 2.5 * dpr; 
        ctx.shadowBlur = 4 * dpr; 
        
        ctx.font = `900 ${sz}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.strokeText('Go!', canvas.width / 2, canvas.height / 2);
        ctx.restore();
    } else {
        showingGoText = false;
    }
}

function animate() {
    requestAnimationFrame(animate);

    if (audioMode !== 'idle' && analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < 12; i++) sum += dataArray[i];
        audioIntensity = sum / 12;
    } else {
        audioIntensity *= 0.92;
    }

    if (sessionStartTime && !sessionComplete) {
        const elapsed = (performance.now() - sessionStartTime) / 1000;
        const remaining = Math.max(0, SESSION_DURATION - elapsed);
        const m = Math.floor(remaining / 60);
        const s = Math.floor(remaining % 60);
        timerEl.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        affirmTimer += 1/60;
        if (affirmTimer >= AFFIRM_INTERVAL) { affirmTimer = 0; showAffirmation(); }
        if (elapsed >= SESSION_DURATION) triggerSessionComplete();
    }

    idleTime += calmMode ? 0.008 : 0.018;
    const pulse = audioMode === 'idle' ? (Math.sin(idleTime)*0.5+0.5) : 0;
    const boost = audioIntensity*(calmMode?0.02:0.04) + pulse*(calmMode?0.15:0.3);

    ctx.fillStyle = calmMode ? 'rgba(0,0,0,0.14)' : 'rgba(0,0,0,0.16)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => { p.update(boost); p.draw(audioIntensity, pulse); });
    ctx.globalCompositeOperation = 'source-over';

    if (showingGoText) {
        drawGoText();
    }
}

window.addEventListener('resize', resize);
resize();
animate();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
</body>
</html>
