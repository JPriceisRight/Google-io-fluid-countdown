<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SELF QUEST</title>
    <link rel="manifest" href="site.webmanifest">
    <meta property="og:title" content="SELF QUEST">
    <meta property="og:description" content="A gentle tool for relaxation and focus.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://selfquest.app">
    <meta property="og:image" content="https://selfquest.app/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Self Quest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="apple-touch-icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #brand {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -55%);
            text-align: center;
            font-family: 'Arial Rounded MT Bold', 'Nunito', 'Arial Black', sans-serif;
            font-size: clamp(64px, 18vw, 120px);
            font-weight: 900; letter-spacing: 3px; line-height: 0.95;
            text-transform: uppercase; pointer-events: none; z-index: 10;
            transition: opacity 1.5s ease; white-space: nowrap;
            color: rgb(80, 250, 240);
            text-shadow: 0 0 4px rgba(150,255,250,1), 0 0 12px rgba(80,240,230,0.85), 0 0 24px rgba(0,200,200,0.4);
        }
        #brand.hidden { opacity: 0; }
        #timer { position: absolute; top: 36px; width: 100%; text-align: center; color: rgba(129,216,208,0.4); font-size: 13px; letter-spacing: 8px; pointer-events: none; z-index: 15; }
        #affirmation {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; color: rgba(129,216,208,0);
            font-size: clamp(10px, 2.8vw, 15px);
            letter-spacing: 3px;
            pointer-events: none; z-index: 20;
            width: 95%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            line-height: 1.4; transition: color 2.5s, opacity 2.5s;
            text-transform: uppercase; font-weight: 500;
            text-shadow: 0 0 8px rgba(129,216,208,0.9), 0 0 18px rgba(129,216,208,0.6), 0 0 35px rgba(0,242,255,0.3);
        }
        #controls { position: absolute; bottom: 65px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 15px; z-index: 20; align-items: center; width: 100%; }
        .btn { background: rgba(0,0,0,0.5); border: 1.5px solid rgba(255,255,255,0.75); color: rgba(129,216,208,1); font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 5px; padding: 16px 44px; cursor: pointer; transition: all 0.3s; text-transform: uppercase; backdrop-filter: blur(8px); text-shadow: 0 0 10px rgba(129,216,208,0.8); box-shadow: 0 0 14px rgba(129,216,208,0.15); min-width: 260px; }
        .btn:hover { border-color:#fff; color:#fff; box-shadow: 0 0 24px rgba(129,216,208,0.5); }
        .btn.active { border-color: rgba(57,255,20,0.9); color: rgba(57,255,20,1); text-shadow: 0 0 10px rgba(57,255,20,0.8); box-shadow: 0 0 22px rgba(57,255,20,0.35); }
        #hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(129,216,208,0.22); font-size: 9px; letter-spacing: 4px; pointer-events: none; z-index: 15; text-transform: uppercase; transition: opacity 2s; }
        #complete { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; pointer-events: none; opacity: 0; transition: opacity 3s; background: rgba(0,0,0,0.92); }
        #complete.show { opacity:1; pointer-events:all; }
        #complete-text { color: rgba(129,216,208,0.95); font-size: 14px; letter-spacing: 6px; text-transform: uppercase; text-align: center; line-height: 3.2; text-shadow: 0 0 18px rgba(129,216,208,0.6); }
        #replay-btn { margin-top: 40px; background: transparent; border: 1.5px solid rgba(255,255,255,0.65); color: rgba(129,216,208,1); font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 5px; padding: 14px 32px; cursor: pointer; text-transform: uppercase; text-shadow: 0 0 10px rgba(129,216,208,0.5); }
        #replay-btn:hover { border-color:#fff; color:#fff; }
        #small-doses { position: absolute; bottom: 6px; right: 16px; color: rgba(129,216,208,0.1); font-size: 8px; letter-spacing: 3px; pointer-events: none; z-index: 15; text-transform: uppercase; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="brand">SELF<br>QUEST</div>
<div id="timer">––:––</div>
<div id="affirmation"></div>
<div id="controls">
    <button class="btn" id="play-btn">▶ Begin Quest</button>
    <button class="btn" id="calm-btn">🌙 Calm Mode</button>
</div>
<div id="hint">touch · move · breathe</div>
<div id="small-doses">Small Doses</div>
<div id="complete">
    <div id="complete-text">your quest is complete<br>keep this with you<br>you are more than enough</div>
    <button id="replay-btn" onclick="replayQuest()">↺ Begin Again</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const playBtn = document.getElementById('play-btn');
const calmBtn = document.getElementById('calm-btn');
const timerEl = document.getElementById('timer');
const affirmationEl = document.getElementById('affirmation');
const completeEl = document.getElementById('complete');
const hintEl = document.getElementById('hint');
const brandEl = document.getElementById('brand');

let dpr;
let stars = [];       // idle laser stars
let galaxy = [];      // quest: drifting space dust with downward bias
let calmDots = [];    // calm mode: barely moving stagnant dots
let shootingStars = []; // occasional shooting star streaks

const STAR_COUNT   = 110;
const GALAXY_COUNT = 1700; // doubled
const CALM_COUNT   = 900;

let analyser, dataArray, audioCtx;
let audioIntensity = 0, smoothIntensity = 0;
let idleTime = 0;
let audioMode = 'idle';
let questActive = false;
let calmMode = false;
let currentAudio = null;
let sessionStartTime = null, sessionDuration = 255, sessionComplete = false;
let showingGoText = false, goTextStartTime = 0;
const GO_TEXT_DURATION = 2000;

let pointer = { x:-9999, y:-9999, active:false, vx:0, vy:0, prevX:-9999, prevY:-9999 };
let affirmationVisible = false;
let particleOpacity = 1.0;
let affirmationRect = null;

// Shooting star timer
let nextShootingStarTime = 0;

const AFFIRMATIONS = [
    "you are exactly where you need to be",
    "this moment belongs to you",
    "let it pass · it always does",
    "you are stronger than you know",
    "breathe · release · return",
    "peace is already within you",
    "you are not your thoughts",
    "this too shall pass",
    "you are safe right now",
    "your mind is clearing",
    "you are more than enough",
    "one breath at a time",
    "you deserve this moment",
];
let affirmIndex = 0, affirmTimer = 0;
const AFFIRM_INTERVAL = 30;

const SONG_PLAYLIST = [
    '808beat-4GSynthG1.mp3',
    '809beat-nightrider.mp3',
    '810beat-dejavuagain.mp3',
    '811beat-909instrumental.mp3',
    '812beat-kingofdaho.mp3',
    '813beat-21jazzstreet.mp3'
];
function getRandomSong() { return SONG_PLAYLIST[Math.floor(Math.random()*SONG_PLAYLIST.length)]; }

const COLORS_NORMAL = [[0,242,255],[0,230,255],[80,250,240],[0,255,230],[0,210,250],[100,255,245]];
const COLORS_CALM   = [[0,255,65],[57,255,20],[120,255,100],[0,255,65],[180,255,160],[0,255,130]];
const rc = () => { const p=calmMode?COLORS_CALM:COLORS_NORMAL; return p[Math.floor(Math.random()*p.length)]; };

// ── INPUT ──────────────────────────────────────────────────────────────────
function updatePointer(x,y) {
    pointer.vx=x-pointer.prevX; pointer.vy=y-pointer.prevY;
    pointer.prevX=pointer.x; pointer.prevY=pointer.y;
    pointer.x=x; pointer.y=y; pointer.active=true;
}
window.addEventListener('mousemove',e=>updatePointer(e.clientX*dpr,e.clientY*dpr));
window.addEventListener('mouseout',()=>{pointer.active=false;pointer.vx=0;pointer.vy=0;});
window.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    pointer.prevX=t.clientX*dpr; pointer.prevY=t.clientY*dpr;
    pointer.x=t.clientX*dpr; pointer.y=t.clientY*dpr;
    pointer.active=true; pointer.vx=0; pointer.vy=0;
},{passive:true});
window.addEventListener('touchmove',e=>{
    e.preventDefault();
    updatePointer(e.touches[0].clientX*dpr,e.touches[0].clientY*dpr);
},{passive:false});
window.addEventListener('touchend',()=>{pointer.active=false;pointer.vx=0;pointer.vy=0;});

// ── IDLE: LASER BEAM STARS ────────────────────────────────────────────────
class Star {
    constructor(scattered){this.color=rc();this.reset();if(scattered)this.y=Math.random()*canvas.height;}
    reset(){
        this.x=Math.random()*canvas.width;
        this.y=-Math.random()*canvas.height*0.3;
        const spd=Math.random()*0.28+0.12;
        const ang=(Math.random()-0.5)*0.32;
        this.vx=Math.sin(ang)*spd; this.vy=Math.cos(ang)*spd+spd*0.45;
        this.tail=Math.random()*26+12; this.glow=Math.random()*1.1+0.4;
        this.life=Math.random(); this.color=rc();
        this.twinkle=Math.random()*Math.PI*2;
    }
    update(){
        this.twinkle+=0.03; this.x+=this.vx; this.y+=this.vy;
        if(this.y>canvas.height+this.tail){this.reset();return;}
        if(this.x<0||this.x>canvas.width)this.vx*=-0.6;
        if(pointer.active){
            const dx=this.x-pointer.x,dy=this.y-pointer.y;
            const dist=Math.sqrt(dx*dx+dy*dy),r=150*dpr;
            if(dist<r&&dist>0){const f=(r-dist)/r;this.vx+=(dx/dist)*f*1.8;this.vy+=(dy/dist)*f*1.8;}
        }
        this.vx*=0.97; if(this.vy<0.1)this.vy=0.1;
    }
    draw(pulse){
        const [r,g,b]=this.color;
        const tw=0.85+Math.sin(this.twinkle)*0.15;
        const a=Math.min(1,(0.58+this.life*0.35+pulse*0.22)*tw*particleOpacity);
        ctx.beginPath();ctx.arc(this.x,this.y,(this.glow+pulse*0.35)*dpr,0,Math.PI*2);
        ctx.fillStyle=`rgba(${r},${g},${b},${a})`;ctx.fill();
        const tl=(this.tail+pulse*7)*dpr;
        const grad=ctx.createLinearGradient(this.x,this.y,this.x-this.vx*tl*7,this.y-this.vy*tl*7);
        grad.addColorStop(0,`rgba(${r},${g},${b},${a*0.65})`);
        grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
        ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x-this.vx*tl*7,this.y-this.vy*tl*7);
        ctx.strokeStyle=grad;ctx.lineWidth=0.9*dpr;ctx.stroke();
    }
}

// ── QUEST NORMAL: SPACE DUST WITH DOWNWARD DRIFT ──────────────────────────
class SpaceDust {
    constructor(scattered){this.color=rc();this.reset();if(scattered){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;}}
    reset(){
        this.x=Math.random()*canvas.width;
        this.y=scattered?Math.random()*canvas.height:-Math.random()*50*dpr;
        // Gentle multi-directional drift + downward bias
        const horizSpd=(Math.random()-0.5)*0.3;
        const vertSpd=Math.random()*0.35+0.1; // always drifting down
        this.vx=horizSpd;
        this.vy=vertSpd;
        this.size=Math.random()*0.55+0.18; // small
        this.life=Math.random();
        this.alpha=Math.random()*0.5+0.3;
        this.color=rc();
        this.twinkle=Math.random()*Math.PI*2;
        this.twinkleSpd=Math.random()*0.04+0.015;
        this.scatter=0;
    }
    update(musicPulse){
        this.twinkle+=this.twinkleSpd;
        if(this.scatter>0){this.scatter-=0.04;if(this.scatter<0)this.scatter=0;}

        // Swipe scatter
        if(pointer.active){
            const dx=this.x-pointer.x,dy=this.y-pointer.y;
            const dist=Math.sqrt(dx*dx+dy*dy);
            const swipeSpd=Math.sqrt(pointer.vx*pointer.vx+pointer.vy*pointer.vy);
            const rep=100*dpr;
            if(dist<rep&&dist>0){
                const f=(rep-dist)/rep;
                if(swipeSpd>2){
                    this.vx+=(dx/dist)*f*swipeSpd*0.15;
                    this.vy+=(dy/dist)*f*swipeSpd*0.15;
                    this.scatter=Math.min(1,this.scatter+f*0.9);
                } else {
                    this.vx+=(dx/dist)*f*0.35;
                    this.vy+=(dy/dist)*f*0.35;
                }
            }
        }

        // Affirmation — very gentle
        if(affirmationVisible&&affirmationRect){
            const dx=this.x-affirmationRect.cx,dy=this.y-affirmationRect.cy;
            if(Math.abs(dx)<affirmationRect.rw&&Math.abs(dy)<affirmationRect.rh){
                const dist=Math.sqrt(dx*dx+dy*dy)||1;
                this.vx+=(dx/dist)*0.12;this.vy+=(dy/dist)*0.08;
            }
        }

        // Music pulse — gentle speed boost
        const beatBoost=1+musicPulse*0.35;
        this.x+=this.vx*beatBoost;
        this.y+=this.vy*beatBoost;

        // Dampen horizontal drift but keep vertical fall
        this.vx*=0.985;
        // Restore downward drift if slowed too much
        if(this.vy<0.08) this.vy=0.08+Math.random()*0.1;

        // Wrap left/right
        if(this.x<-5*dpr) this.x=canvas.width+5*dpr;
        if(this.x>canvas.width+5*dpr) this.x=-5*dpr;
        // Reset from top when falls off bottom
        if(this.y>canvas.height+10*dpr){
            this.x=Math.random()*canvas.width;
            this.y=-Math.random()*30*dpr;
            this.vx=(Math.random()-0.5)*0.3;
            this.vy=Math.random()*0.35+0.1;
            this.color=rc();
        }
    }
    draw(musicPulse){
        const [r,g,b]=this.color;
        const tw=0.7+Math.sin(this.twinkle)*0.3;
        const scatterFade=1-this.scatter;
        const a=Math.min(0.9,(this.alpha+musicPulse*0.25)*tw*particleOpacity*scatterFade);
        if(a<=0.01)return;
        const sz=(this.size+musicPulse*0.5)*dpr;
        ctx.beginPath();ctx.arc(this.x,this.y,sz*2.2,0,Math.PI*2);
        ctx.fillStyle=`rgba(${r},${g},${b},${a*0.1})`;ctx.fill();
        ctx.beginPath();ctx.arc(this.x,this.y,sz,0,Math.PI*2);
        ctx.fillStyle=`rgba(${r},${g},${b},${a})`;ctx.fill();
    }
}
let scattered = false; // track if reset was scattered

// ── CALM: BARELY MOVING STAGNANT DOTS (unchanged) ─────────────────────────
class CalmDot {
    constructor(){this.color=rc();this.reset(true);}
    reset(scattered){
        this.x=Math.random()*canvas.width;
        this.y=scattered?Math.random()*canvas.height:Math.random()*canvas.height;
        const spd=Math.random()*0.06+0.01; // ultra slow
        const ang=Math.random()*Math.PI*2;
        this.vx=Math.cos(ang)*spd; this.vy=Math.sin(ang)*spd;
        this.size=Math.random()*0.55+0.18;
        this.alpha=Math.random()*0.45+0.3;
        this.color=rc();
        this.twinkle=Math.random()*Math.PI*2;
        this.twinkleSpd=Math.random()*0.025+0.008;
    }
    update(){
        this.twinkle+=this.twinkleSpd;
        this.x+=this.vx; this.y+=this.vy;
        this.vx*=0.992; this.vy*=0.992;
        // Keep barely alive
        const spd=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
        if(spd<0.005){const a=Math.random()*Math.PI*2;this.vx+=Math.cos(a)*0.008;this.vy+=Math.sin(a)*0.008;}
        if(this.x<0)this.x=canvas.width; if(this.x>canvas.width)this.x=0;
        if(this.y<0)this.y=canvas.height; if(this.y>canvas.height)this.y=0;
    }
    draw(musicPulse){
        const [r,g,b]=this.color;
        const tw=0.7+Math.sin(this.twinkle)*0.3;
        const a=Math.min(0.9,(this.alpha+musicPulse*0.2)*tw*particleOpacity);
        if(a<=0.01)return;
        const sz=(this.size+musicPulse*0.4)*dpr;
        ctx.beginPath();ctx.arc(this.x,this.y,sz*2,0,Math.PI*2);
        ctx.fillStyle=`rgba(${r},${g},${b},${a*0.1})`;ctx.fill();
        ctx.beginPath();ctx.arc(this.x,this.y,sz,0,Math.PI*2);
        ctx.fillStyle=`rgba(${r},${g},${b},${a})`;ctx.fill();
    }
}

// ── SHOOTING STAR ─────────────────────────────────────────────────────────
class ShootingStar {
    constructor(){
        this.x=Math.random()*canvas.width*0.6;
        this.y=Math.random()*canvas.height*0.4;
        const ang=Math.PI*0.15+Math.random()*0.3;
        const spd=8+Math.random()*6;
        this.vx=Math.cos(ang)*spd; this.vy=Math.sin(ang)*spd;
        this.tail=Math.random()*60+40;
        this.life=1.0;
        this.decay=0.025+Math.random()*0.015;
        const cols=COLORS_NORMAL;
        this.color=cols[Math.floor(Math.random()*cols.length)];
    }
    update(){this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;}
    draw(){
        const [r,g,b]=this.color;
        const a=Math.max(0,this.life*0.7);
        const grad=ctx.createLinearGradient(this.x,this.y,this.x-this.vx*this.tail,this.y-this.vy*this.tail);
        grad.addColorStop(0,`rgba(${r},${g},${b},${a})`);
        grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
        ctx.beginPath();ctx.moveTo(this.x,this.y);
        ctx.lineTo(this.x-this.vx*this.tail,this.y-this.vy*this.tail);
        ctx.strokeStyle=grad;ctx.lineWidth=1.5*dpr;ctx.stroke();
        ctx.beginPath();ctx.arc(this.x,this.y,1.5*dpr,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();
    }
    get dead(){return this.life<=0||this.x>canvas.width+100||this.y>canvas.height+100;}
}

// ── CONTROLS ───────────────────────────────────────────────────────────────
function enableCalmMode(){
    calmMode=true;calmBtn.textContent='☀️ Normal Mode';calmBtn.classList.add('active');
    calmDots.forEach(p=>p.color=rc());
}
function disableCalmMode(){
    calmMode=false;calmBtn.textContent='🌙 Calm Mode';calmBtn.classList.remove('active');
    galaxy.forEach(p=>p.color=rc());
}
calmBtn.addEventListener('click',()=>calmMode?disableCalmMode():enableCalmMode());

playBtn.addEventListener('click',async()=>{
    if(audioMode==='track'){
        if(currentAudio)currentAudio.pause();
        audioMode='idle';questActive=false;calmMode=false;
        calmBtn.textContent='🌙 Calm Mode';calmBtn.classList.remove('active');
        stars=[];for(let i=0;i<STAR_COUNT;i++)stars.push(new Star(true));
        playBtn.textContent='▶ Begin Quest';playBtn.classList.remove('active');
        sessionStartTime=null;timerEl.textContent='––:––';
        hintEl.style.opacity='1';brandEl.classList.remove('hidden');
        showingGoText=false;particleOpacity=1.0;
        affirmationEl.style.opacity='0';affirmationEl.style.color='rgba(129,216,208,0)';
        return;
    }
    try{
        if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        if(audioCtx.state==='suspended')await audioCtx.resume();
        analyser=audioCtx.createAnalyser();analyser.fftSize=512;
        dataArray=new Uint8Array(analyser.frequencyBinCount);
        const randomSong=getRandomSong();
        currentAudio=new Audio(randomSong);
        currentAudio.crossOrigin='anonymous';currentAudio.loop=false;
        currentAudio.addEventListener('loadedmetadata',()=>{
            sessionDuration=currentAudio.duration||255;
            const m=Math.floor(sessionDuration/60),s=Math.floor(sessionDuration%60);
            timerEl.textContent=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        });
        const source=audioCtx.createMediaElementSource(currentAudio);
        source.connect(analyser);analyser.connect(audioCtx.destination);
        await currentAudio.play();
        audioMode='track';questActive=true;
        sessionStartTime=performance.now();sessionComplete=false;
        affirmIndex=0;affirmTimer=0;
        // Build both quest particle sets
        galaxy=[];for(let i=0;i<GALAXY_COUNT;i++)galaxy.push(new SpaceDust(true));
        calmDots=[];for(let i=0;i<CALM_COUNT;i++)calmDots.push(new CalmDot());
        nextShootingStarTime=performance.now()+8000+Math.random()*12000;
        playBtn.textContent='■ End Quest';playBtn.classList.add('active');
        hintEl.style.opacity='0';
        showingGoText=true;goTextStartTime=performance.now();
        setTimeout(()=>brandEl.classList.add('hidden'),1800);
        setTimeout(()=>showAffirmation(),5000);
        currentAudio.addEventListener('ended',()=>{if(!sessionComplete)triggerSessionComplete();});
    }catch(e){playBtn.textContent='Audio Error';console.error(e);}
});

function resize(){
    dpr=window.devicePixelRatio||1;
    canvas.width=window.innerWidth*dpr;canvas.height=window.innerHeight*dpr;
    stars=[];for(let i=0;i<STAR_COUNT;i++)stars.push(new Star(true));
    galaxy=[];for(let i=0;i<GALAXY_COUNT;i++)galaxy.push(new SpaceDust(true));
    calmDots=[];for(let i=0;i<CALM_COUNT;i++)calmDots.push(new CalmDot());
}

// ── AFFIRMATION — subtle whisper ──────────────────────────────────────────
function showAffirmation(){
    if(sessionComplete)return;
    const text=AFFIRMATIONS[affirmIndex%AFFIRMATIONS.length];
    affirmationEl.textContent=text;
    affirmationEl.style.transition='color 2s, opacity 2s';
    affirmationEl.style.opacity='1';
    affirmationEl.style.color=calmMode?'rgba(160,255,140,0.85)':'rgba(0,242,255,0.85)';
    affirmationVisible=true;updateAffirmationRect();
    const targetOpacity=0.6;
    const fadeOut=setInterval(()=>{particleOpacity-=0.025;if(particleOpacity<=targetOpacity){particleOpacity=targetOpacity;clearInterval(fadeOut);}},40);
    setTimeout(()=>{
        affirmationEl.style.transition='color 3s, opacity 3s';
        affirmationEl.style.color='rgba(0,242,255,0)';affirmationEl.style.opacity='0';
        const fadeIn=setInterval(()=>{particleOpacity+=0.02;if(particleOpacity>=1.0){particleOpacity=1.0;clearInterval(fadeIn);}},40);
        setTimeout(()=>{affirmationVisible=false;},3000);
    },5500);
    affirmIndex++;
}
function updateAffirmationRect(){
    const rect=affirmationEl.getBoundingClientRect();
    affirmationRect={cx:(rect.left+rect.width/2)*dpr,cy:(rect.top+rect.height/2)*dpr,rw:(rect.width/2+20)*dpr,rh:(rect.height/2+15)*dpr};
}

function replayQuest(){
    completeEl.classList.remove('show');
    sessionStartTime=null;sessionComplete=false;
    timerEl.textContent='––:––';playBtn.textContent='▶ Begin Quest';playBtn.classList.remove('active');
    audioMode='idle';questActive=false;calmMode=false;
    calmBtn.textContent='🌙 Calm Mode';calmBtn.classList.remove('active');
    stars=[];for(let i=0;i<STAR_COUNT;i++)stars.push(new Star(true));
    hintEl.style.opacity='1';
    affirmationEl.style.color='rgba(0,242,255,0)';affirmationEl.style.opacity='0';
    affirmationVisible=false;particleOpacity=1.0;showingGoText=false;
    brandEl.classList.remove('hidden');
}
function triggerSessionComplete(){
    if(sessionComplete)return;sessionComplete=true;completeEl.classList.add('show');
    if(currentAudio){setTimeout(()=>{let vol=1;const fade=setInterval(()=>{vol-=0.05;if(currentAudio)currentAudio.volume=Math.max(0,vol);if(vol<=0)clearInterval(fade);},200);},2000);}
}
function drawGoText(){
    const elapsed=performance.now()-goTextStartTime;
    if(elapsed<GO_TEXT_DURATION){
        const progress=elapsed/GO_TEXT_DURATION;
        const sz=Math.min(canvas.width,canvas.height)*0.18;
        ctx.save();
        let alpha;
        if(progress<0.2)alpha=progress/0.2;
        else if(progress<0.65)alpha=1;
        else alpha=1-(progress-0.65)/0.35;
        ctx.globalAlpha=Math.max(0,alpha);
        ctx.font=`900 ${sz}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.shadowColor='rgba(57,255,20,1)';ctx.shadowBlur=40*dpr;
        ctx.strokeStyle='rgba(57,255,20,1)';ctx.lineWidth=3*dpr;
        ctx.strokeText('Go!',canvas.width/2,canvas.height/2);
        ctx.shadowBlur=12*dpr;ctx.fillStyle='rgba(100,255,60,0.95)';
        ctx.fillText('Go!',canvas.width/2,canvas.height/2);ctx.restore();
    }else{showingGoText=false;}
}

function animate(){
    requestAnimationFrame(animate);
    if(audioMode!=='idle'&&analyser){
        analyser.getByteFrequencyData(dataArray);
        let bass=0,mid=0;
        for(let i=0;i<10;i++)bass+=dataArray[i];
        for(let i=10;i<40;i++)mid+=dataArray[i];
        audioIntensity=(bass/10)*0.7+(mid/30)*0.3;
    }else{audioIntensity*=0.92;}
    smoothIntensity+=(audioIntensity-smoothIntensity)*0.15;

    if(sessionStartTime&&!sessionComplete){
        const elapsed=(performance.now()-sessionStartTime)/1000;
        const remaining=Math.max(0,sessionDuration-elapsed);
        const m=Math.floor(remaining/60),s=Math.floor(remaining%60);
        timerEl.textContent=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        affirmTimer+=1/60;
        if(affirmTimer>=AFFIRM_INTERVAL){affirmTimer=0;showAffirmation();}
        if(elapsed>=sessionDuration)triggerSessionComplete();
    }
    if(affirmationVisible)updateAffirmationRect();

    // Shooting stars during quest normal mode
    if(questActive&&!calmMode&&performance.now()>nextShootingStarTime){
        shootingStars.push(new ShootingStar());
        nextShootingStarTime=performance.now()+10000+Math.random()*20000;
    }
    shootingStars=shootingStars.filter(s=>!s.dead);
    shootingStars.forEach(s=>s.update());

    idleTime+=0.014;
    const pulse=audioMode==='idle'?(Math.sin(idleTime)*0.5+0.5):0;
    const musicPulse=Math.min(1,smoothIntensity/80);

    // Clear — quest normal needs faster clear for moving particles
    ctx.fillStyle=questActive&&!calmMode?'rgba(0,0,0,0.35)':questActive&&calmMode?'rgba(0,0,0,0.22)':'rgba(0,0,0,0.20)';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.globalCompositeOperation='lighter';

    if(!questActive){
        // IDLE: laser stars
        stars.forEach(p=>{p.update();p.draw(pulse);});
    } else if(calmMode){
        // CALM: stagnant dots
        calmDots.forEach(p=>{p.update();p.draw(musicPulse);});
    } else {
        // QUEST NORMAL: falling space dust + occasional shooting stars
        galaxy.forEach(p=>{p.update(musicPulse);p.draw(musicPulse);});
        shootingStars.forEach(s=>s.draw());
    }

    ctx.globalCompositeOperation='source-over';
    if(showingGoText)drawGoText();
}

window.addEventListener('resize',resize);
resize();
animate();
</script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js');});
  }
</script>
